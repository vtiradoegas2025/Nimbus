<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="face" x1="146" y1="92" x2="866" y2="936" gradientUnits="userSpaceOnUse">
      <stop stop-color="#263440"/>
      <stop offset="0.48" stop-color="#16212b"/>
      <stop offset="1" stop-color="#090f15"/>
    </linearGradient>
    <linearGradient id="storm" x1="424" y1="218" x2="516" y2="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7fafb"/>
      <stop offset="0.42" stop-color="#cbd3d8"/>
      <stop offset="0.72" stop-color="#8b969e"/>
      <stop offset="1" stop-color="#4c5862"/>
    </linearGradient>
    <linearGradient id="tower" x1="424" y1="360" x2="463" y2="792" gradientUnits="userSpaceOnUse">
      <stop stop-color="#dfe5e8"/>
      <stop offset="0.58" stop-color="#9ba6ad"/>
      <stop offset="1" stop-color="#56626b"/>
    </linearGradient>
    <linearGradient id="funnel" x1="478" y1="631" x2="488" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#aeb8be"/>
      <stop offset="0.56" stop-color="#707c84"/>
      <stop offset="1" stop-color="#d4dadd"/>
    </linearGradient>
    <linearGradient id="bolt" x1="748" y1="444" x2="681" y2="701" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff7a5"/>
      <stop offset="0.38" stop-color="#ffe363"/>
      <stop offset="1" stop-color="#f5b82e"/>
    </linearGradient>
    <linearGradient id="monogram" x1="205" y1="701" x2="371" y2="858" gradientUnits="userSpaceOnUse">
