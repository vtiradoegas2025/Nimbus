    </filter>
    <clipPath id="face-clip">
      <rect x="64" y="64" width="896" height="896" rx="208"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#face)"/>
    <rect x="66" y="66" width="892" height="892" rx="206" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>
  </g>

