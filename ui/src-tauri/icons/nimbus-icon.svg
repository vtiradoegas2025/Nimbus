      />
      <path
        d="M310 389C331 344 374 316 426 315C477 315 516 347 531 391C551 448 535 516 505 566C482 605 465 653 463 713C423 721 383 711 355 686C367 629 361 583 339 544C316 501 296 444 310 389Z"
        fill="url(#tower)"
      />
      <path
        d="M373 555C403 538 446 538 480 557C507 546 545 551 566 575C560 607 529 625 490 624C466 646 425 647 397 625C369 622 349 607 347 584C350 571 359 562 373 555Z"
        fill="#737f87"
      />
      <path
        d="M447 611C463 601 490 601 507 612C504 638 495 662 490 688C484 720 486 758 478 816C463 785 455 757 459 727C463 696 472 667 469 641C460 633 452 623 447 611Z"
        fill="url(#funnel)"
      />

      <!-- Sparse shading carries the terminal artwork's ice-to-core greyscale ramp. -->
      <path d="M171 414C260 376 366 385 439 418C514 452 613 443 690 397C760 355 840 372 891 411C827 406 770 417 717 444C641 482 550 482 476 448C380 405 281 410 171 444Z" fill="#ffffff" opacity="0.17"/>
      <path d="M329 383C363 349 411 340 448 357C413 390 395 437 400 497C372 476 349 438 329 383Z" fill="#ffffff" opacity="0.21"/>
      <path d="M529 434C613 435 699 409 760 374C812 377 855 390 888 416C814 417 756 435 698 461C636 480 577 468 529 434Z" fill="#5d6973" opacity="0.42"/>
      <path d="M278 471C314 486 356 492 394 481C376 527 371 568 380 610C342 586 310 539 278 471Z" fill="#4a5660" opacity="0.48"/>
    </g>

    <path d="M747 439L691 566H741L668 711L690 594H638L708 439Z" fill="url(#bolt)" filter="url(#bolt-glow)"/>
    <ellipse cx="478" cy="819" rx="38" ry="11" fill="#8d989f" opacity="0.58"/>

    <!-- Compact Nimbus monogram, deliberately secondary to the storm. -->
    <path d="M674 838V704L841 838V704" fill="none" stroke="url(#monogram)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
