    <path d="M79 824C250 804 370 814 481 829C617 848 754 844 960 812" fill="none" stroke="#66717a" stroke-opacity="0.44" stroke-width="8" stroke-linecap="round"/>

    <g filter="url(#storm-shadow)">
      <!-- One continuous supercell silhouette: overshooting top, anvil, tower, wall cloud. -->
      <path
        d="M123 445C151 391 210 357 276 355C292 299 342 258 402 258C425 216 469 192 515 199C556 205 586 231 600 268C635 269 667 285 687 311C747 308 800 324 829 356C873 361 909 386 920 420C894 449 844 458 784 452C749 475 700 483 649 469C613 492 560 493 522 468C490 491 444 495 404 477C372 506 323 514 277 496C241 514 196 507 166 483C141 476 125 463 123 445Z"
