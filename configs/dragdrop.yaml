# Drag-and-drop sounding preset.
#
# Default config used when the user runs:
#
#   ./bin/tornado_sim --sounding=path/to/file.tmv --headless
#
# Explicit `--config <path>` overrides this preset; explicit
# `environment.sounding.*` keys in any active YAML are overridden by the
# --sounding CLI flag (which forces type=file with the supplied path).
#
# Defaults: cylindrical Arakawa C-grid, supercell_cgrid scheme, 256 km
# domain at 2 km horizontal / 250 m vertical, 30 minutes of model time.
# Trigger is a standard 2 K warm bubble; switch to type=vortex_seed in
# the trigger block if running a tornado scheme. See configs/README.md
# for the full menu of overrides.
case_name: dragdrop
coordinate_system: cylindrical
grid:
  nx: 128
  ny: 64
  nz: 48
  dx: 2000.0
  dy: 2000.0
  dz: 250.0
  dt: 1.0
  staggering: c_grid
dynamics:
  scheme: supercell_cgrid
environment:
  # Hodograph anchors are kept as a fallback when the loaded sounding has
  # no winds. Most TMV/SHARPY/HRRR exports do include winds, so the
  # SoundingSource's wind column wins over these defaults via the Auto
  # hodograph dispatch.
  hodograph:
    type: auto
    u_sfc_ms: 4
    v_sfc_ms: 1
    u_1km_ms: 14
    v_1km_ms: 6
    u_6km_ms: 28
    v_6km_ms: 22
trigger:
  type: warm_bubble
  bubble:
    center_x_km: 60
    center_y_km: 0
    center_z_km: 1.5
    radius_km: 10
    dtheta_k: 2.0
microphysics:
  scheme: kessler
numerics:
  time_stepping:
    scheme: split_explicit
    split_acoustic: true
    n_acoustic_substeps: 6
  compute:
    backend: cpu
output:
  write_every_s: 60
  fields: minimal
  format: npy_3d
duration_s: 1800
