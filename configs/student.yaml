# Student preset: small grid, minimal fields, infrequent output.
# Runs in <1GB RAM, produces <500MB output for a 2-hour simulation.
# Suitable for laptops with 8GB RAM or Chromebooks.
case_name: student
grid:
  nx: 64
  ny: 64
  nz: 32
  dx: 2000.0
  dy: 2000.0
  dz: 500.0
  dt: 2.0
environment:
  cape_target_jkg: 3000
  shear_0_6km_ms: 35
  sfc_theta_k: 301.0
  sfc_qv_kgkg: 0.012
  tropopause_z_m: 12000
  midlevel_drying: true
  hodograph:
    type: wk_param
    u_sfc_ms: 4
    v_sfc_ms: 1
    u_1km_ms: 14
    v_1km_ms: 6
    u_6km_ms: 28
    v_6km_ms: 22
trigger:
  bubble:
    center_x_km: 50
    center_y_km: 50
    center_z_km: 1.5
    radius_km: 10
    dtheta_k: 2.0
microphysics:
  scheme: kessler
output:
  write_every_s: 60
  fields: minimal
  format: npy_3d
duration_s: 7200
