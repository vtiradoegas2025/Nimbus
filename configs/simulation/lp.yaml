# Low-Precipitation (LP) supercell variant.
#
# Drier midlevel (midlevel_drying: true), weaker low-level winds
# (u_sfc 4 m/s, v_sfc 1 m/s). LP storms have visible updrafts with
# sparse precipitation -- classical taxonomy from Bluestein & Parks
# (1983). 256x256x64 grid, 1 km horizontal / 250 m vertical, 1 s dt.
# Variant: hp.yaml is the High-Precip counterpart; classic.yaml uses
# a finer 0.1 s timestep at higher vertical resolution.
case_name: lp
grid:
  nx: 256
  ny: 256
  nz: 64
  dx: 1000.0
  dy: 1000.0
  dz: 250.0
  dt: 1.0
environment:
  cape_target_jkg: 3000
  shear_0_6km_ms: 35
  sfc_theta_k: 301.0
  sfc_qv_kgkg: 0.012
  tropopause_z_m: 12000
  midlevel_drying: true
  hodograph:
    type: wk_param
    u_sfc_ms: 4
    v_sfc_ms: 1
    u_1km_ms: 14
    v_1km_ms: 6
    u_6km_ms: 28
    v_6km_ms: 22
trigger:
  bubble:
    center_x_km: 50
    center_y_km: 50
    center_z_km: 1.5
    radius_km: 10
    dtheta_k: 2.0
microphysics:
  scheme: kessler
  qc0: 0.0012
  c_auto: 0.001
  c_accr: 2.0
  c_evap: 0.004
  hail_graupel_enabled: false
output:
  write_every_s: 5
  downsample: [1, 1, 1]
duration_s: 7200

