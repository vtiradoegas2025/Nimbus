# Generated by scripts/dev/configs/generate_resolution_catalog.py.
# Horizontal resolution: 1000 m; domain: 40 km square.
# Microphysics: lin; physics profile: tke_radiation.
# This is an exploratory user preset, not a qualification fixture.
schema: nimbus.v1

grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 40
  ny: 40
  nz: 64
  dx: 1000
  dy: 1000
  dz: 250
  ztop: 16000

time:
  run_time: 900
  dt_large: 2
  acoustic_substeps: 8
  adaptive_dt: false
  cfl_safety: 0.6
  output_interval: 300

domain_motion:
  mode: stationary
  frame_velocity:
    u_ms: 0
    v_ms: 0
  lifetime_planning:
    enabled: false
    action: error
    motion_source: bunkers_right
    explicit_u_ms: 0
    explicit_v_ms: 0
    upstream_buffer_m: 0
    downstream_buffer_m: 0
    cross_track_buffer_m: 0
    motion_uncertainty_ms: 0
  tracking:
    enabled: false
    recycle_domain: false
    interval_s: 60
    inner_margin_m: 8000
    maximum_shift_cells: 0
    cooldown_s: 300
    minimum_confidence: 0.8
    minimum_updraft_ms: 5
    minimum_condensate_path_kgm2: 0.1
    updraft_helicity_bottom_m_agl: 2000
    updraft_helicity_top_m_agl: 5000
    minimum_absolute_updraft_helicity_m2s2: 25
    minimum_component_cells: 4
    minimum_core_area_m2: 1000000
    maximum_motion_speed_ms: 75
    maximum_motion_acceleration_ms2: 0.25
    minimum_continuity_samples: 3
    lost_after_samples: 3
    topology_confirmation_samples: 2
    branch_preference: continuity
    branch_velocity_uncertainty_ms: 5
  nesting:
    enabled: false
    parent_ratio_x: 3
    parent_ratio_y: 3
    parent_time_step_ratio: 3
    child_origin_parent_cell_i: 0
    child_origin_parent_cell_j: 0
    child_cells_x: 0
    child_cells_y: 0
    relaxation_width_child_cells: 0
    boundary_stencil_parent_cells: 1
    relaxation_e_folding_time_s: 2
    feedback: one_way

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: radiative
    east: radiative
    south: radiative
    north: radiative
  bottom: rigid_slip
  top: rigid_with_sponge

damping:
  enabled: true
  z_d: 12000
  alpha: 0.05
  mode: explicit
  lateral_width: 10
  lateral_alpha: 0.05
  lateral_sponge_enabled: true
  w_only_top_sponge: true
  w_only_depth_cells: 8
  w_only_alpha_max: 0.2

coriolis:
  enabled: true
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: lin
  shared:
    cloud_water_threshold_kgkg: 0.001
    autoconversion_rate_s_inv: 0.001
  lin:
    accretion_coefficient: 2.2
    evaporation_rate_s_inv: 0.001

turbulence:
  scheme: tke
  mode: 3d
  Cs: 0.18
  Pr_t: 0.3333333333333333
  Sc_t: 0.3333333333333333

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: none
  apply_fluxes: false
  emissivity: 0.95
  tsk_k: 300

boundary_layer:
  scheme: none

radiation:
  scheme: simple_grey
  solar_forcing: idealized_diurnal
  latitude_deg: 35
  declination_deg: 15
  local_solar_time_at_start_h: 12
  do_lw: true
  do_sw: true
  cadence_s: 300
  clear_sky_only: true
  tau_lw_ref: 6
  tau_sw_ref: 0.22
  n_lw: 4
  n_sw: 2
  terrain_sw_cosine_nodes: 4
  terrain_sw_azimuth_nodes: 8
  terrain_sw_maximum_bounces: 32
  terrain_sw_relative_residual_tolerance: 1.0e-10
  terrain_sw_absolute_residual_tolerance_w: 1.0e-9

terrain:
  scheme: none
  coordinate: btf
  compute_derivatives: true
  compute_metrics: true
  smoothing_decay: 0.1
  bell:
    h0: 1000
    a: 5000
    axisymmetric: false
  schar:
    H: 1000
    a: 5000
    ell: 4000

initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 3000
    tropopause_m: 12000
    surface_theta_k: 301
    moisture_qv_kgkg: 0.014
  hodograph:
    type: wk_param
    u_sfc_ms: 4
    v_sfc_ms: 1
    u_1km_ms: 14
    v_1km_ms: 6
    u_6km_ms: 28
    v_6km_ms: 22
  trigger:
    type: bubble
    bubble:
      dtheta_k: 4
      radius_km: 4
      center_x_m: 20000
      center_y_m: 20000
      center_z_m: 1500
    vortex_seed:
      r_max_m: 6000
      v_max_ms: 40
      z_top_m: 6000
      center_x_m: 20000
      center_y_m: 20000
      center_z_m: 3000

output:
  preset: minimal
  format: npy_3d
  async_io: true
  live_shm: false
  live_shm_fields: [w, reflectivity_dbz, vorticity_z]
  live_shm_interval_s: 1
  live_shm_full_rate: false
  qualification_diagnostics:
    preset: none
  trajectories: false
  trajectory_seed_time_s: 300
  trajectory_count: 5
  trajectory_sample_interval_s: 10
  trajectory_max_samples_per_parcel: 2048
  netcdf_deflate_level: 2
  netcdf_shuffle: true
  netcdf_target_chunk_kib: 1024
  zfp_tolerance: 0
  zfp_mode: accuracy
  zfp_precision_bits: 16
  zfp_rate_bps: 8
  zfp_keyframe_interval: 0
  zfp_sparse_threshold: 0
  zfp_float16_prefilter: false
  zfp_predictive_delta: false
  zfp_field_execution: serial
  zfp_field_workers: 0
  zfp_field_scratch_mib: 64
  zfp_per_field_tolerances: false
  zfp_tight_tolerance: 0.0001
  zfp_moderate_tolerance: 0.001
  zfp_loose_tolerance: 0.01
  tiered_write_cadence: false
  write_cadence_medium_s: 30
  write_cadence_slow_s: 60
  keep_last_frames: 3
  minimum_free_space_mib: 4096
  maximum_retained_history_files: 256

extensions:
  compute:
    backend: cpu
    memory_admission: reject
    allow_fallback: false
    validate_parity: false
    gpu_apply_microphysics: true
    gpu_apply_slow: false
    gpu_apply_sgs: false
  solver:
    slow_rk2: true
    lid_bc_gamma: -1
    axis_u_m1_filter: false
  chaos:
    scheme: none
    seed: 0
    member_id: 0
  execution:
    mode: exploratory
  checkpoint:
    every_s: 0
    keep_last: 2
    minimum_free_space_mib: 4096
    directory: data/checkpoints
  validation:
    guard_mode: warn
  diagnostics:
    scientific_every_steps: 10
    deterministic_reductions: false
  performance:
    timing: true
    report_every_steps: 100
    warmup_steps: 5
