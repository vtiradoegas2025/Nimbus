# C.10 Test 2: Uniform-wind equilibrium on the cylindrical Arakawa C-grid.
#
# Standard WK2002 hodograph, no trigger bubble. The hodograph is a
# horizontally homogeneous environmental wind; with no convective trigger and
# no surface friction inside the dynamics, the state should remain close to
# the initial condition over a short integration.
#
# Pass criterion (per docs/CoordinateBackend_Plan.md C.10): tendencies < 1e-6.
# First-pass harness checks just exit code + absence of FATAL / GUARD events.
#
# supercell_cgrid is the right scheme here because the WK2002 hodograph is
# the standard supercell environment.
case_name: cgrid_uniform_wind
coordinate_system: cylindrical
grid:
  nx: 32
  ny: 32
  nz: 24
  dx: 2000.0
  dy: 2000.0
  dz: 500.0
  dt: 2.0
  staggering: c_grid
environment:
  cape_target_jkg: 3000
  shear_0_6km_ms: 35
  sfc_theta_k: 301.0
  sfc_qv_kgkg: 0.012
  tropopause_z_m: 12000
  midlevel_drying: true
  hodograph:
    type: wk_param
    u_sfc_ms: 4
    v_sfc_ms: 1
    u_1km_ms: 14
    v_1km_ms: 6
    u_6km_ms: 28
    v_6km_ms: 22
trigger:
  bubble:
    center_x_km: 50
    center_y_km: 50
    center_z_km: 1.5
    radius_km: 10
    dtheta_k: 0.0
dynamics:
  scheme: supercell_cgrid
microphysics:
  scheme: kessler
numerics:
  time_stepping:
    scheme: split_explicit
    split_acoustic: true
    n_acoustic_substeps: 6
  compute:
    backend: cpu
output:
  write_every_s: 0
  fields: minimal
  format: npy_3d
duration_s: 60
