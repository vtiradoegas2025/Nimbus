# C.10 Test 1: Hydrostatic equilibrium on the cylindrical Arakawa C-grid.
#
# Calm atmosphere -- zero hodograph, no trigger bubble. The base state is in
# hydrostatic balance after `initialize()`; the C-grid split-explicit dynamics
# with reference-state subtraction in dw/dt should hold that balance through
# many acoustic substeps without spurious vertical motion.
#
# Pass criterion (per docs/CoordinateBackend_Plan.md C.10): tendencies ~ 0
# and zero clamps. The shell harness measures the post-run by checking exit
# code + absence of FATAL / GUARD events. A second pass adds a quantitative
# velocity-magnitude gate once the diagnostics infrastructure is wired.
#
# tornado_cgrid is the right scheme for this case: it has no horizontal
# perturbation Coriolis or supercell-style microphysics and exposes the
# hydrostatic gate cleanly.
case_name: cgrid_hydrostatic
coordinate_system: cylindrical
grid:
  nx: 32
  ny: 32
  nz: 24
  dx: 2000.0
  dy: 2000.0
  dz: 500.0
  dt: 2.0
  staggering: c_grid
environment:
  cape_target_jkg: 0
  shear_0_6km_ms: 0
  sfc_theta_k: 300.0
  sfc_qv_kgkg: 0.001
  tropopause_z_m: 12000
  midlevel_drying: false
  hodograph:
    type: wk_param
    u_sfc_ms: 0
    v_sfc_ms: 0
    u_1km_ms: 0
    v_1km_ms: 0
    u_6km_ms: 0
    v_6km_ms: 0
trigger:
  bubble:
    center_x_km: 50
    center_y_km: 50
    center_z_km: 1.5
    radius_km: 10
    dtheta_k: 0.0
dynamics:
  scheme: tornado_cgrid
microphysics:
  scheme: none      # hydrostatic-of-dynamics test; microphysics out of the loop
numerics:
  time_stepping:
    scheme: split_explicit
    split_acoustic: true
    n_acoustic_substeps: 6
  compute:
    backend: cpu
output:
  write_every_s: 0
  fields: minimal
  format: npy_3d
duration_s: 300
