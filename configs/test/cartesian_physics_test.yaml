# Cartesian physics integration test
# Smaller dt for stability, diffusion enabled, all physics active
case_name: physics_integration_test
coordinate_system: cartesian
grid:
  nx: 64
  ny: 64
  nz: 32
  dx: 2000.0
  dy: 2000.0
  dz: 500.0
  dt: 1.0
environment:
  cape_target_jkg: 3000
  shear_0_6km_ms: 35
  sfc_theta_k: 301.0
  sfc_qv_kgkg: 0.012
  tropopause_z_m: 12000
  midlevel_drying: true
  hodograph:
    type: wk_param
    u_sfc_ms: 4
    v_sfc_ms: 1
    u_1km_ms: 14
    v_1km_ms: 6
    u_6km_ms: 28
    v_6km_ms: 22
trigger:
  bubble:
    center_x_km: 50
    center_y_km: 50
    center_z_km: 1.5
    radius_km: 10
    dtheta_k: 2.0
dynamics:
  scheme: cartesian
microphysics:
  scheme: kessler
radiation:
  scheme: simple_grey
  lw: true
  sw: true
  dt: 60
boundary_layer:
  scheme: slab
  surface_fluxes: true
  dt: 30
numerics:
  time_stepping:
    scheme: split_explicit
    split_acoustic: true
    n_acoustic_substeps: 10
  diffusion:
    scheme: explicit
    K_h: 500
    K_v: 50
  compute:
    backend: cpu
output:
  write_every_s: 5
  fields: presentation
  format: npy_3d
duration_s: 1800
