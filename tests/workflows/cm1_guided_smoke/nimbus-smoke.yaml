# Nimbus Studio baseline created from a reviewed CM1 input_sounding projection.
# IMPORT SCOPE: sounding only. Other values are Nimbus defaults, not translated CM1 controls.
# GUIDED SMOKE: 30 s total with 10 s output; extend only after review.
schema: nimbus.v1

grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 16
  ny: 16
  nz: 16
  dx: 1000
  dy: 1000
  dz: 1000
  ztop: 16000

time:
  run_time: 30
  dt_large: 1
  acoustic_substeps: 6
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 10

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: open
    east: open
    south: open
    north: open
  bottom: rigid_noslip
  top: rigid_with_sponge

damping:
  enabled: true
  z_d: 12000
  alpha: 0.05
  mode: explicit

coriolis:
  enabled: false
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: none

turbulence:
  scheme: smagorinsky
  mode: 3d
  Cs: 0.18
  Pr_t: 0.7
  Sc_t: 0.7

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: slab
  apply_fluxes: true

boundary_layer:
  scheme: slab

radiation:
  scheme: none

initial_conditions:
  sounding:
    type: file
    file_path: tests/workflows/cm1_guided_smoke/nimbus-sounding.txt
  hodograph:
    type: custom
    u_sfc_ms: 0
    v_sfc_ms: 0
    u_1km_ms: 0
    v_1km_ms: 0
    u_6km_ms: 0
    v_6km_ms: 0
  trigger:
    type: none

output:
  preset: minimal
  format: npy_3d
  async_io: true
  live_shm: false

extensions:
  compute:
    backend: cpu
  chaos:
    scheme: none
    seed: 0
    member_id: 0
  execution:
    mode: exploratory
    acknowledge_maturity_limits: false
  checkpoint:
    every_s: 0
    directory: ""
    resume_from: ""
  validation:
    guard_mode: warn
