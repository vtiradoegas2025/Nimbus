schema: nimbus.v1

# Historical SCI-324 semantic fixture. This freezes the typed 84x76 campaign
# profile described by the archived evidence; the original source bytes were
# not retained, so the evidence record's config SHA-256 remains the authority
# for the exact input artifact used by that run.
#
# Public Nimbus binaries reject moving_nest. A future historical reproduction
# target may admit this exact exploratory CPU profile only through the internal
# qualification binary; it must not broaden public configuration admission.
grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 134
  ny: 105
  nz: 50
  dx: 1200
  dy: 1200
  dz: 320
  ztop: 16000

time:
  run_time: 4500
  dt_large: 1.5
  acoustic_substeps: 8
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 450

domain_motion:
  mode: moving_nest
  lifetime_planning:
    enabled: false
  tracking:
    enabled: true
    recycle_domain: false
    interval_s: 30
    inner_margin_m: 10000
    maximum_shift_cells: 9
    cooldown_s: 300
    minimum_confidence: 0.65
    minimum_updraft_ms: 5
    minimum_condensate_path_kgm2: 0.1
    updraft_helicity_bottom_m_agl: 2000
    updraft_helicity_top_m_agl: 5000
    minimum_absolute_updraft_helicity_m2s2: 25
    minimum_component_cells: 4
    maximum_motion_speed_ms: 75
    maximum_motion_acceleration_ms2: 0.25
    minimum_continuity_samples: 3
    lost_after_samples: 3
    topology_confirmation_samples: 2
    branch_preference: bunkers_right
    branch_velocity_uncertainty_ms: 3
  nesting:
    enabled: true
    parent_ratio_x: 2
    parent_ratio_y: 2
    parent_time_step_ratio: 2
    child_origin_parent_cell_i: 2
    child_origin_parent_cell_j: 1
    # SCI-324's interim measurement geometry: 50.4 by 45.6 km physical.
    child_cells_x: 84
    child_cells_y: 76
    relaxation_width_child_cells: 8
    boundary_stencil_parent_cells: 1
    relaxation_e_folding_time_s: 30
    feedback: one_way

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: radiative
    east: radiative
    south: radiative
    north: radiative
  bottom: rigid_slip
  top: rigid

damping:
  enabled: true
  z_d: 14000
  alpha: 0.00333
  mode: explicit
  lateral_width: 10
  lateral_alpha: 0.05
  lateral_sponge_enabled: true
  w_only_top_sponge: true
  w_only_depth_cells: 8
  w_only_alpha_max: 0.2

coriolis:
  enabled: true
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: kessler
  shared:
    cloud_water_threshold_kgkg: 0.001
    autoconversion_rate_s_inv: 0.001
  kessler:
    accretion_coefficient: 2.2
    evaporation_efficiency: 1.0

turbulence:
  scheme: smagorinsky
  mode: 3d
  Cs: 0.18
  Pr_t: 0.3333333333333333
  Sc_t: 0.3333333333333333

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: none
  apply_fluxes: false

boundary_layer:
  scheme: none

radiation:
  scheme: none

terrain:
  scheme: none

initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 3000
    tropopause_m: 12000
    surface_theta_k: 301
    moisture_qv_kgkg: 0.012
  hodograph:
    type: wk_param
    u_sfc_ms: 4
    v_sfc_ms: 1
    u_1km_ms: 14
    v_1km_ms: 6
    u_6km_ms: 28
    v_6km_ms: 22
  trigger:
    type: bubble
    bubble:
      dtheta_k: 4
      radius_km: 4
      center_x_m: 26000
      center_y_m: 20000
      center_z_m: 1500

output:
  preset: minimal
  format: npy_3d
  async_io: false
  live_shm: false

extensions:
  execution:
    mode: exploratory
    acknowledge_maturity_limits: false
  compute:
    backend: cpu
  checkpoint:
    every_s: 2250
  diagnostics:
    scientific_every_steps: 10
    deterministic_reductions: true
  validation:
    guard_mode: error
