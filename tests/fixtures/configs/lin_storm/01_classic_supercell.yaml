# Bounded flat Lin storm fixture.
# Engineering-ready flat Lin storm family; mature campaigns and scientific review remain separate.
schema: nimbus.v1

grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 48
  ny: 48
  nz: 180
  dx: 50
  dy: 50
  dz: 100
  ztop: 18000

time:
  run_time: 2
  dt_large: 0.1
  acoustic_substeps: 8
  adaptive_dt: false
  cfl_safety: 0.4
  output_interval: 1

domain_motion:
  mode: stationary

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

advection:
  scheme: tvd

boundary_conditions:
  lateral:
    west: radiative
    east: radiative
    south: radiative
    north: radiative
  bottom: rigid_slip
  top: rigid_with_sponge

damping:
  enabled: true
  z_d: 14000
  alpha: 0.003
  mode: explicit
  lateral_width: 0
  lateral_alpha: 0
  lateral_sponge_enabled: false
  w_only_top_sponge: true
  w_only_depth_cells: 20
  w_only_alpha_max: 0.02

coriolis:
  enabled: false

microphysics:
  scheme: lin
  shared:
    cloud_water_threshold_kgkg: 0.001
    autoconversion_rate_s_inv: 0.001
  lin:
    accretion_coefficient: 2.2
    evaporation_rate_s_inv: 0.001

turbulence:
  scheme: smagorinsky
  mode: 3d
  Cs: 0.18
  Pr_t: 0.3333333333333333
  Sc_t: 0.3333333333333333

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: none
  apply_fluxes: false

boundary_layer:
  scheme: none

radiation:
  scheme: none

terrain:
  scheme: none

initial_conditions:
  sounding:
    type: file
    file_path: "tests/fixtures/configs/lin_storm/soundings/01_classic_supercell.txt"
  hodograph:
    type: auto
  trigger:
    type: bubble
    bubble:
      dtheta_k: 2
      cloud_water_kgkg: 0
      radius_km: 0.6
      center_x_m: 1200
      center_y_m: 1200
      center_z_m: 1500

output:
  preset: presentation
  format: npy_3d
  async_io: false
  live_shm: false
  keep_last_frames: 0
  minimum_free_space_mib: 1024
  maximum_retained_history_files: 0

extensions:
  compute:
    backend: vulkan
    memory_admission: reject
    allow_fallback: false
    gpu_apply_microphysics: true
    gpu_apply_slow: false
    gpu_apply_sgs: false
  solver:
    slow_rk2: true
  execution:
    mode: qualified
  checkpoint:
    every_s: 1
    keep_last: 2
    minimum_free_space_mib: 1024
  validation:
    guard_mode: error
  diagnostics:
    scientific_every_steps: 1
    deterministic_reductions: true
  performance:
    timing: true
    report_every_steps: 10
