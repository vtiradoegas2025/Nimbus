schema: nimbus.v1

# Cartesian C-grid WK supercell at convection-resolving resolution (dx=600 m).
# The coarse 32^3/dx=2000 fixtures cannot resolve a storm updraft (~1 cell wide);
# this run resolves it (~7 cells) to test whether the scheme sustains moist
# convection via latent heat -- max_w should grow well past the dry-bubble
# response and stay bounded.
grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 64
  ny: 64
  nz: 50
  dx: 600
  dy: 600
  dz: 320
  ztop: 16000

time:
  run_time: 1800
  dt_large: 1.5
  acoustic_substeps: 8
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 120

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: radiative
    east: radiative
    south: radiative
    north: radiative
  bottom: rigid_slip
  top: rigid

damping:
  enabled: true
  z_d: 11200
  alpha: 0.05
  mode: explicit

coriolis:
  enabled: true
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: kessler

turbulence:
  scheme: smagorinsky
  # PBL owns vertical mixing; SGS is horizontal-only to avoid double counting.
  mode: 2d
  Cs: 0.18
  Pr_t: 0.7
  Sc_t: 0.7

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: slab
  apply_fluxes: true

boundary_layer:
  scheme: slab

radiation:
  scheme: none

initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 3000
    tropopause_m: 12000
    surface_theta_k: 301
    moisture_qv_kgkg: 0.012
  hodograph:
    type: wk_param
    u_sfc_ms: 4.0
    v_sfc_ms: 1.0
    u_1km_ms: 14.0
    v_1km_ms: 6.0
    u_6km_ms: 28.0
    v_6km_ms: 22.0
  trigger:
    type: bubble
    bubble:
      dtheta_k: 4
      radius_km: 4
      center_x_m: 19200
      center_y_m: 19200
      center_z_m: 1500

output:
  preset: presentation
  format: npy_3d
  async_io: true
  live_shm: false

extensions:
  compute:
    # Active PBL is CPU-only; do not imply an unqualified hybrid backend.
    backend: cpu
  validation:
    guard_mode: warn
