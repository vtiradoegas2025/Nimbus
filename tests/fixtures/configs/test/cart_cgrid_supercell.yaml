schema: nimbus.v1

# Cartesian C-grid WK supercell: CAPE=3000 moist sounding + curved hodograph +
# Kessler microphysics (latent heat) + a 2 K bubble. The validation target --
# the storm must initiate, build a sustained updraft, and stay bounded (no
# runaway to the wind clamp, no checkerboard, no NaN).
grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 32
  ny: 32
  nz: 32
  dx: 2000
  dy: 2000
  dz: 500
  ztop: 16000

time:
  run_time: 1200
  dt_large: 2.0
  acoustic_substeps: 6
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 0

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: radiative
    east: radiative
    south: radiative
    north: radiative
  bottom: rigid_slip
  top: rigid

damping:
  enabled: true
  z_d: 11200
  alpha: 0.05
  mode: explicit

coriolis:
  enabled: true
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: kessler

turbulence:
  scheme: smagorinsky
  # PBL owns vertical mixing; SGS is horizontal-only to avoid double counting.
  mode: 2d
  Cs: 0.18
  Pr_t: 0.7
  Sc_t: 0.7

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: slab
  apply_fluxes: true

boundary_layer:
  scheme: slab

radiation:
  scheme: none

initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 3000
    tropopause_m: 12000
    surface_theta_k: 301
    moisture_qv_kgkg: 0.012
  hodograph:
    type: wk_param
    u_sfc_ms: 4.0
    v_sfc_ms: 1.0
    u_1km_ms: 14.0
    v_1km_ms: 6.0
    u_6km_ms: 28.0
    v_6km_ms: 22.0
  trigger:
    type: bubble
    bubble:
      dtheta_k: 4
      radius_km: 4
      center_x_m: 32000
      center_y_m: 32000
      center_z_m: 1500

output:
  preset: minimal
  format: npy_3d
  async_io: true
  live_shm: false

extensions:
  compute:
    backend: cpu
  validation:
    guard_mode: warn
