# Nimbus v1 configuration (machine-generated)
# Mirrors docs/CM1Mapping.md §20. CM1 namelist groups noted per section.
schema: nimbus.v1

# CM1 &param0 / &param11 — Grid setup
grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 128
  ny: 128
  nz: 64
  dx: 1000
  dy: 1000
  dz: 250
  ztop: 16000

# CM1 &param1 / &param2 — Time control + output cadence
time:
  run_time: 300
  dt_large: 1
  acoustic_substeps: 10
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 5

# Dynamics core (one solver; CM1 calls this Klemp-Wilhelmson split-explicit)
dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

# CM1 &param3 — Boundary conditions
boundary_conditions:
  lateral:
    west: zero_gradient
    east: zero_gradient
    south: zero_gradient
    north: zero_gradient
  bottom: rigid_slip
  top: rigid

# CM1 &param7 — Rayleigh damping (top sponge)
damping:
  enabled: true
  z_d: 11200
  alpha: 0.05
  mode: explicit

# CM1 &param12 — Coriolis
coriolis:
  enabled: true
  mode: f_plane
  latitude_deg: 35

# CM1 &param4 — Microphysics
microphysics:
  scheme: kessler

# CM1 &param5 — SGS turbulence
turbulence:
  scheme: smagorinsky
  # PBL owns vertical mixing; SGS is horizontal-only to avoid double counting.
  mode: 2d
  Cs: 0.18
  Pr_t: 0.7
  Sc_t: 0.7

# CM1 &param6 — Numerical diffusion
diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 25
  apply_to: scalars

# CM1 &param9 — Surface
surface:
  scheme: slab
  apply_fluxes: true
  tsk_k: 301

# Boundary-layer mixing (Nimbus addition; not in CM1)
boundary_layer:
  scheme: slab

# CM1 &param8 — Radiation (deferred per §24)
radiation:
  scheme: simple_grey
  solar_forcing: idealized_diurnal
  latitude_deg: 35
  declination_deg: 15
  local_solar_time_at_start_h: 0

# CM1 iinit family — Initial conditions
initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 3000
    tropopause_m: 12000
    surface_theta_k: 301
    moisture_qv_kgkg: 0.012
  hodograph:
    type: wk_param
    u_sfc_ms: 4
    v_sfc_ms: 1
    u_1km_ms: 14
    v_1km_ms: 6
    u_6km_ms: 28
    v_6km_ms: 22
  trigger:
    type: bubble
    bubble:
      dtheta_k: 2
      radius_km: 10
      center_x_m: 50000
      center_y_m: 50000
      center_z_m: 1500
    vortex_seed:
      r_max_m: 6000
      v_max_ms: 40
      z_top_m: 6000
      center_x_m: 0
      center_y_m: 0
      center_z_m: 3000

# Output
output:
  preset: presentation
  format: npy_3d
  async_io: true
  live_shm: false

# Nimbus extensions (additive — not part of CM1)
extensions:
  compute:
    backend: cpu
  chaos:
    scheme: none
    seed: 0
    member_id: 0
  validation:
    guard_mode: warn
