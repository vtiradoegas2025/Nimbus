schema: nimbus.v1

grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 16
  ny: 16
  nz: 24
  dx: 1000
  dy: 1000
  dz: 500
  ztop: 12000

time:
  run_time: 2
  dt_large: 0.5
  acoustic_substeps: 6
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 0

domain_motion:
  mode: stationary
  nesting:
    enabled: true
    parent_ratio_x: 2
    parent_ratio_y: 2
    parent_time_step_ratio: 2
    child_origin_parent_cell_i: 5
    child_origin_parent_cell_j: 5
    child_cells_x: 8
    child_cells_y: 8
    relaxation_width_child_cells: 1
    boundary_stencil_parent_cells: 1
    relaxation_e_folding_time_s: 2
    feedback: one_way

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid

boundary_conditions:
  lateral:
    west: radiative
    east: radiative
    south: radiative
    north: radiative
  bottom: rigid_slip
  top: rigid

damping:
  enabled: false

coriolis:
  enabled: false

microphysics:
  scheme: none

turbulence:
  scheme: none

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: none
  apply_fluxes: false

boundary_layer:
  scheme: none

radiation:
  scheme: none

initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 0
    tropopause_m: 8000
    surface_theta_k: 300
    moisture_qv_kgkg: 0.004
  hodograph:
    type: wk_param
    u_sfc_ms: 0
    v_sfc_ms: 0
    u_1km_ms: 0
    v_1km_ms: 0
    u_6km_ms: 0
    v_6km_ms: 0
  trigger:
    type: none

output:
  preset: minimal
  format: zfp_high
  async_io: false
  zfp_keyframe_interval: 8
  zfp_predictive_delta: true
  live_shm: false

extensions:
  compute:
    backend: cpu
  diagnostics:
    scientific_every_steps: 0
  validation:
    guard_mode: error
