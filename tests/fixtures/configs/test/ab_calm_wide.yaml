
schema: nimbus.v1

# A/B harness config: identical to tests/fixtures/configs/beast/beast_storm.yaml except
# run_time 4500 -> 720 and output_interval 90 -> 60. Used to compare WENO5 vs
# the MC-limiter baseline (reports/monster_mc_baseline) on the warm-bubble
# triggering phase: does the bubble theta-perturbation survive and the updraft
# erupt past the MC ceiling of ~1.5 m/s. Not a render config.
grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 128
  ny: 128
  nz: 64
  dx: 400
  dy: 400
  dz: 250
  ztop: 16000

time:
  run_time: 600
  dt_large: 1.5
  acoustic_substeps: 8
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 60

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: radiative
    east: radiative
    south: radiative
    north: radiative
  bottom: rigid_slip
  top: rigid

damping:
  enabled: true
  z_d: 11200
  alpha: 0.05
  mode: explicit

coriolis:
  enabled: false
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: lin

turbulence:
  scheme: smagorinsky
  # PBL owns vertical mixing; SGS is horizontal-only to avoid double counting.
  mode: 2d
  Cs: 0.18
  Pr_t: 0.7
  Sc_t: 0.7

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: slab
  apply_fluxes: false

boundary_layer:
  scheme: slab

radiation:
  scheme: none

initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 4000
    tropopause_m: 13000
    surface_theta_k: 302
    moisture_qv_kgkg: 0.016
  hodograph:
    type: wk_param
    u_sfc_ms: 0.0
    v_sfc_ms: 0.0
    u_1km_ms: 0.0
    v_1km_ms: 0.0
    u_6km_ms: 0.0
    v_6km_ms: 0.0
  trigger:
    type: bubble
    bubble:
      dtheta_k: 8
      radius_km: 6.0
      center_x_m: 25600
      center_y_m: 25600
      center_z_m: 1500

output:
  preset: presentation
  format: npy_3d
  async_io: true
  live_shm: false

extensions:
  compute:
    backend: cpu
  validation:
    guard_mode: warn
