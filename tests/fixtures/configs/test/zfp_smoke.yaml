schema: nimbus.v1
# Tiny ZFP end-to-end smoke: exercises the v1 output.format: zfp_high path
# (config selection + key passthrough) and produces .zfp3d fixtures for the
# Studio reader. Keyframe-only (zfp_keyframe_interval defaults to 0) so every
# frame is self-contained / randomly seekable.
grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 48
  ny: 48
  nz: 24
  dx: 200
  dy: 200
  dz: 200
  ztop: 4800
time:
  run_time: 20
  dt_large: 0.5
  acoustic_substeps: 8
  adaptive_dt: false
  cfl_safety: 0.5
  output_interval: 10
dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false
boundary_conditions:
  lateral:
    west: radiative
    east: radiative
    south: radiative
    north: radiative
  bottom: rigid_slip
  top: rigid
microphysics:
  scheme: lin
turbulence:
  scheme: smagorinsky
  mode: 3d
  Cs: 0.18
surface:
  scheme: none
  apply_fluxes: false
boundary_layer:
  scheme: none
initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 2000
    tropopause_m: 12000
    surface_theta_k: 300
    moisture_qv_kgkg: 0.014
  trigger:
    type: bubble
    bubble:
      dtheta_k: 4
      radius_km: 2
      center_x_m: 4800
      center_y_m: 4800
      center_z_m: 1000
output:
  preset: presentation
  format: zfp_high
  async_io: true
extensions:
  compute:
    # Keep this codec/integration fixture on the universally supported backend;
    # GPU qualification is a separate matrix. Surface/PBL physics are disabled
    # explicitly so this fixture measures only the codec/integration path.
    backend: cpu
