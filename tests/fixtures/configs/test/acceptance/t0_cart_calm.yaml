# Nimbus v1 acceptance fixture (GENERATED by scripts/gen_acceptance_matrix.py)
# Phase F.6.A tier: 0 calm hydrostatic (cart)
# Mirrors docs/CM1Mapping.md §20. Do not hand-edit; edit the generator.
schema: nimbus.v1

# CM1 &param0 / &param11 — Grid setup
grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 32
  ny: 32
  nz: 32
  dx: 2000
  dy: 2000
  dz: 500
  ztop: 16000

# CM1 &param1 / &param2 — Time control + output cadence
time:
  run_time: 7200
  dt_large: 2.0
  acoustic_substeps: 6
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 0

# Dynamics core (Klemp-Wilhelmson split-explicit)
dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

# CM1 &param3 — Boundary conditions
boundary_conditions:
  lateral:
    west: zero_gradient
    east: zero_gradient
    south: zero_gradient
    north: zero_gradient
  bottom: rigid_slip
  top: rigid

# CM1 &param7 — Rayleigh damping (top sponge)
damping:
  enabled: true
  z_d: 11200
  alpha: 0.05
  mode: explicit

# CM1 &param12 — Coriolis
coriolis:
  enabled: true
  mode: f_plane
  latitude_deg: 35

# CM1 &param4 — Microphysics
microphysics:
  scheme: none

# CM1 &param5 — SGS turbulence
turbulence:
  scheme: none
  mode: 3d
  Cs: 0.18
  Pr_t: 0.7
  Sc_t: 0.7

# CM1 &param6 — Numerical diffusion
diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

# CM1 &param9 — Surface
surface:
  scheme: none
  apply_fluxes: false

# Boundary-layer mixing (Nimbus addition; not in CM1)
boundary_layer:
  scheme: none

# CM1 &param8 — Radiation (deferred per §24)
radiation:
  scheme: none

# CM1 iinit family — Initial conditions
initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 0
    tropopause_m: 12000
    surface_theta_k: 300
    moisture_qv_kgkg: 0.004
  hodograph:
    type: wk_param
    u_sfc_ms: 0.0
    v_sfc_ms: 0.0
    u_1km_ms: 0.0
    v_1km_ms: 0.0
    u_6km_ms: 0.0
    v_6km_ms: 0.0
  trigger:
    type: bubble
    bubble:
      dtheta_k: 0
      radius_km: 10
      center_x_m: 32000
      center_y_m: 32000
      center_z_m: 1500
    vortex_seed:
      r_max_m: 6000
      v_max_ms: 40
      z_top_m: 6000
      center_x_m: 0
      center_y_m: 0
      center_z_m: 3000

# Output
output:
  preset: minimal
  format: npy_3d
  async_io: true
  live_shm: false

# Nimbus extensions (additive — not part of CM1)
extensions:
  compute:
    backend: cpu
  chaos:
    scheme: none
    seed: 0
    member_id: 0
  validation:
    guard_mode: warn
