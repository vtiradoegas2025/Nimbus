schema: nimbus.v1

# Cartesian C-grid FULL-PHYSICS-STACK anchor.
#
# Purpose: a single known-good config that exercises EVERY physics module
# together on the audited Cartesian C-grid path -- microphysics + SGS
# turbulence + surface fluxes + PBL mixing + radiation -- as the integration
# anchor for the multi-config test matrix. It replaces the stale cylindrical
# physics_full_stack.yaml (deferred coordinate) and the A-grid t5_cart_*
# acceptance fixtures (wrong staggering) as the "everything on" reference.
#
# Physics base (grid / sounding / hodograph / trigger / dt) follows the proven
# Cartesian C-grid WK supercell. Deliberate, documented choices:
#   - microphysics: lin (single-moment mixed-phase) -- exercises the full ice
#     chain in the coupled stack. NOTE: Lin over-accumulates the anvil on this
#     grid (a known Phase-4 ice-microphysics item); swap to kessler for clean
#     render output. It is stable here, which is what this anchor checks.
#   - surface: slab + boundary_layer: ysu -- a REAL PBL run. After the config
#     fix, an explicit PBL scheme wins the runtime slot and consumes the slab
#     surface fluxes (verify the banner reports "Boundary Layer: ysu").
#   - radiation: simple_grey -- the only implemented radiation scheme (RRTMG
#     is recognized but not implemented); proves radiation couples in the stack.
#   - turbulence Pr_t/Sc_t omitted -> inherit the audited LES default of 1/3
#     (turbulence_base.hpp). Do NOT set the legacy RANS 0.7 here.
#   - damping: the audited C6 sponge (z_d above the ~13 km EL, CM1-standard
#     1/300 strength, rho/p not relaxed), not the pre-audit z_d 11200 / a 0.05.
#   - backend: cpu (default for determinism). The Cartesian C-grid GPU path runs
#     this full stack and is CPU/GPU-parity-validated; run with --compute-backend
#     gpu for the hybrid (dynamics + microphysics + SGS on GPU; PBL/surface/
#     radiation column physics on CPU, applied on GPU). Thompson stays CPU-only.
grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 128
  ny: 128
  nz: 64
  dx: 400
  dy: 400
  dz: 250
  ztop: 16000

time:
  run_time: 1800
  dt_large: 1.5
  acoustic_substeps: 8
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 120

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: radiative
    east: radiative
    south: radiative
    north: radiative
  bottom: rigid_slip
  top: rigid

damping:
  enabled: true
  # Audited C6 sponge: starts above the sounding EL (~13 km) so the anvil /
  # overshooting top stay physical; CM1-standard 1/300 strength; rho/p not relaxed.
  z_d: 14000
  alpha: 0.00333
  mode: explicit

coriolis:
  enabled: true
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: lin

turbulence:
  scheme: smagorinsky
  # PBL owns vertical mixing; SGS is horizontal-only to avoid double counting.
  mode: 2d
  Cs: 0.18
  # Pr_t / Sc_t intentionally omitted -> inherit the audited LES default 1/3.

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: slab
  apply_fluxes: true
  tsk_k: 302

boundary_layer:
  scheme: ysu

radiation:
  scheme: simple_grey
  solar_forcing: idealized_diurnal
  latitude_deg: 35
  declination_deg: 15
  local_solar_time_at_start_h: 0

initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 4000
    tropopause_m: 13000
    surface_theta_k: 302
    moisture_qv_kgkg: 0.016
  hodograph:
    type: wk_param
    u_sfc_ms: 4.0
    v_sfc_ms: 1.0
    u_1km_ms: 14.0
    v_1km_ms: 6.0
    u_6km_ms: 28.0
    v_6km_ms: 22.0
  trigger:
    type: bubble
    bubble:
      dtheta_k: 8
      radius_km: 8.0
      center_x_m: 12800
      center_y_m: 12800
      center_z_m: 1000

output:
  preset: presentation
  format: npy_3d
  async_io: true
  live_shm: false

extensions:
  compute:
    backend: cpu
  validation:
    guard_mode: warn
