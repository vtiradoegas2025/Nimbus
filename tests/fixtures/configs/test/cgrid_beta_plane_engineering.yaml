# Short production-path engineering smoke for Earth-referenced beta-plane
# Coriolis on a translating Cartesian C-grid. This is not a long/reference
# qualification campaign.
schema: nimbus.v1

grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 10
  ny: 10
  nz: 8
  dx: 1000
  dy: 1000
  dz: 500
  ztop: 4000

time:
  run_time: 2
  dt_large: 0.5
  acoustic_substeps: 6
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 0

domain_motion:
  mode: constant_velocity
  frame_velocity:
    u_ms: 4
    v_ms: -2

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: periodic
    east: periodic
    south: periodic
    north: periodic
  bottom: rigid_slip
  top: rigid

damping:
  enabled: false
  z_d: 4000
  alpha: 0
  mode: explicit
  lateral_width: 0
  lateral_alpha: 0
  lateral_sponge_enabled: false
  w_only_top_sponge: false
  w_only_depth_cells: 0
  w_only_alpha_max: 0

coriolis:
  enabled: true
  mode: beta_plane
  latitude_deg: 35

microphysics:
  scheme: none

turbulence:
  scheme: none
  mode: 3d
  Cs: 0.18
  Pr_t: 0.7
  Sc_t: 0.7

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: none
  apply_fluxes: false

boundary_layer:
  scheme: none

radiation:
  scheme: none

terrain:
  scheme: none

initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 0
    tropopause_m: 8000
    surface_theta_k: 300
    moisture_qv_kgkg: 0.004
  hodograph:
    type: wk_param
    u_sfc_ms: 12
    v_sfc_ms: -1
    u_1km_ms: 12
    v_1km_ms: -1
    u_6km_ms: 12
    v_6km_ms: -1
  trigger:
    type: bubble
    bubble:
      dtheta_k: 0
      radius_km: 1
      center_x_m: 5000
      center_y_m: 5000
      center_z_m: 1000

output:
  preset: minimal
  format: npy_3d
  async_io: false
  live_shm: false

extensions:
  execution:
    mode: exploratory
    acknowledge_maturity_limits: false
  compute:
    backend: cpu
    allow_fallback: false
  checkpoint:
    every_s: 0
  diagnostics:
    scientific_every_steps: 1
    deterministic_reductions: true
  validation:
    guard_mode: error
