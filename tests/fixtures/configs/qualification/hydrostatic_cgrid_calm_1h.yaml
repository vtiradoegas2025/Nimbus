schema: nimbus.v1

# Laptop-scale scientific qualification fixture for the production Cartesian
# C-grid.  The production-profile, zero-wind column must remain hydrostatically and
# acoustically balanced for one simulated hour without any strict-validation
# repair or bounds event.  This is a calm moist-column hold (microphysics is
# disabled), not yet the separate dry/moist pair required for full validation.
grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 32
  ny: 32
  nz: 32
  dx: 2000
  dy: 2000
  dz: 500
  ztop: 16000

time:
  run_time: 3600
  dt_large: 2.0
  acoustic_substeps: 6
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 3600

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: radiative
    east: radiative
    south: radiative
    north: radiative
  bottom: rigid_slip
  top: rigid

damping:
  enabled: true
  z_d: 14000
  alpha: 0.00333
  mode: explicit

coriolis:
  enabled: true
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: none

turbulence:
  scheme: none
  mode: 3d
  Cs: 0.18
  Pr_t: 0.7
  Sc_t: 0.7

advection:
  scheme: tvd

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: none
  apply_fluxes: false

boundary_layer:
  scheme: none

radiation:
  scheme: none

initial_conditions:
  sounding:
    type: parametric_cape
    # ParametricCAPE consumes CAPE, surface theta/qv, and a truthful
    # procedural tropopause boundary. Diagnostic CIN/LCL/LFC/EL
    # targets belong to parametric_targets and are rejected here.
    cape_jkg: 0
    tropopause_m: 12000
    surface_theta_k: 300
    # Match the active ParametricCAPE minimum instead of relying on a silent
    # clamp from a lower requested value.
    moisture_qv_kgkg: 0.004
  hodograph:
    type: wk_param
    u_sfc_ms: 0
    v_sfc_ms: 0
    u_1km_ms: 0
    v_1km_ms: 0
    u_6km_ms: 0
    v_6km_ms: 0
  trigger:
    type: none

output:
  preset: minimal
  format: npy_3d
  async_io: true
  live_shm: false

extensions:
  execution:
    mode: qualified
  compute:
    backend: cpu
  diagnostics:
    # The qualification checker computes initial/final physical-domain
    # inventories directly. Per-stage budget qualification is a separate gate.
    scientific_every_steps: 0
  validation:
    # Strict stage validation runs every model step even with science reductions
    # disabled, so any non-finite or bounds violation aborts the qualification.
    guard_mode: error
