schema: nimbus.v1

grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 18
  ny: 18
  nz: 18
  dx: 500
  dy: 500
  dz: 500
  ztop: 9000

time:
  run_time: 65
  dt_large: 0.2
  acoustic_substeps: 6
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 65

domain_motion:
  mode: tracked_window
  frame_velocity:
    u_ms: 0
    v_ms: 0
  tracking:
    enabled: true
    recycle_domain: true
    interval_s: 1
    inner_margin_m: 250
    maximum_shift_cells: 8
    cooldown_s: 65
    minimum_confidence: 0.01
    minimum_updraft_ms: 0.01
    minimum_condensate_path_kgm2: 0.06
    updraft_helicity_bottom_m_agl: 500
    updraft_helicity_top_m_agl: 3000
    minimum_absolute_updraft_helicity_m2s2: 0.000000001
    minimum_component_cells: 1
    minimum_core_area_m2: 1
    maximum_motion_speed_ms: 1000
    maximum_motion_acceleration_ms2: 1000
    minimum_continuity_samples: 2
    lost_after_samples: 3
    topology_confirmation_samples: 1
    branch_preference: continuity
    branch_velocity_uncertainty_ms: 5

  nesting:
    enabled: true
    parent_ratio_x: 2
    parent_ratio_y: 2
    parent_time_step_ratio: 2
    child_origin_parent_cell_i: 11
    child_origin_parent_cell_j: 5
    child_cells_x: 8
    child_cells_y: 8
    relaxation_width_child_cells: 1
    boundary_stencil_parent_cells: 1
    relaxation_e_folding_time_s: 2
    feedback: two_way

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: radiative
    east: radiative
    south: radiative
    north: radiative
  bottom: rigid_slip
  top: rigid

damping:
  enabled: false
  z_d: 9000
  alpha: 0
  mode: explicit
  lateral_width: 0
  lateral_alpha: 0
  lateral_sponge_enabled: false
  w_only_top_sponge: false
  w_only_depth_cells: 0
  w_only_alpha_max: 0

coriolis:
  enabled: false
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: kessler
  shared:
    cloud_water_threshold_kgkg: 0.001
    autoconversion_rate_s_inv: 0.001
  kessler:
    accretion_coefficient: 2.2
    evaporation_efficiency: 1.0

turbulence:
  scheme: none
  mode: 3d
  Cs: 0.18
  Pr_t: 0.7
  Sc_t: 0.7

advection:
  scheme: tvd

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: slab
  apply_fluxes: true
  z0m_m: 0.1
  z0h_m: 0.01
  albedo: 0.2
  emissivity: 0.96
  tsk_k: 300
  qsfc_kgkg: 0.012

boundary_layer:
  scheme: slab

radiation:
  scheme: simple_grey
  solar_forcing: idealized_diurnal
  latitude_deg: 0
  declination_deg: 0
  local_solar_time_at_start_h: 12
  do_lw: true
  do_sw: false
  cadence_s: 2
  clear_sky_only: true
  simple_grey_optical_model: pressure_clear_sky_v1
  use_subcycling: false
  subcycle_count: 1
  enable_diagnostics: false
  tau_lw_ref: 2.5
  tau_sw_ref: 0.15
  n_lw: 1
  n_sw: 1

terrain:
  scheme: bell
  coordinate: smoothed
  horizontal_placement: earth_fixed
  feature_center_earth_x_m: 4500
  feature_center_earth_y_m: 4500
  compute_derivatives: true
  compute_metrics: true
  smoothing_decay: 0.1
  bell:
    h0: 300
    a: 1800
    axisymmetric: true

initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 2500
    tropopause_m: 8000
    surface_theta_k: 300
    moisture_qv_kgkg: 0.012
  hodograph:
    type: wk_param
    u_sfc_ms: 5
    v_sfc_ms: 0
    u_1km_ms: 10
    v_1km_ms: 5
    u_6km_ms: 25
    v_6km_ms: 15
  trigger:
    type: bubble
    bubble:
      dtheta_k: 4
      radius_km: 2
      center_x_m: 7000
      center_y_m: 4500
      center_z_m: 1500

output:
  preset: minimal
  format: npy_3d
  async_io: false
  live_shm: false

extensions:
  execution:
    mode: qualified
  compute:
    backend: cpu
    allow_fallback: false
    gpu_apply_microphysics: false
    gpu_apply_slow: false
    gpu_apply_sgs: false
  chaos:
    scheme: full_stochastic
    seed: 233
    member_id: 0
  diagnostics:
    scientific_every_steps: 1
    deterministic_reductions: true
  validation:
    guard_mode: error
