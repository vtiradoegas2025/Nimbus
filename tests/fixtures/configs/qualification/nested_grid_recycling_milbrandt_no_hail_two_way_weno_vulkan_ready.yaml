schema: nimbus.v1

grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 18
  ny: 18
  nz: 24
  dx: 1000
  dy: 1000
  dz: 500
  ztop: 12000

time:
  run_time: 120
  dt_large: 0.5
  acoustic_substeps: 8
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 0

domain_motion:
  mode: tracked_window
  frame_velocity:
    u_ms: 0
    v_ms: 0
  tracking:
    enabled: true
    recycle_domain: true
    interval_s: 1
    inner_margin_m: 4000
    maximum_shift_cells: 6
    cooldown_s: 2
    minimum_confidence: 0.01
    minimum_updraft_ms: 0.01
    minimum_condensate_path_kgm2: 0.000001
    updraft_helicity_bottom_m_agl: 500
    updraft_helicity_top_m_agl: 3000
    minimum_absolute_updraft_helicity_m2s2: 0.000001
    minimum_component_cells: 1
    minimum_core_area_m2: 1
    maximum_motion_speed_ms: 1000
    maximum_motion_acceleration_ms2: 1000
    minimum_continuity_samples: 2
    lost_after_samples: 3
    topology_confirmation_samples: 1
    branch_preference: continuity
    branch_velocity_uncertainty_ms: 5
  nesting:
    enabled: true
    parent_ratio_x: 2
    parent_ratio_y: 2
    parent_time_step_ratio: 2
    child_origin_parent_cell_i: 11
    child_origin_parent_cell_j: 5
    child_cells_x: 8
    child_cells_y: 8
    relaxation_width_child_cells: 1
    boundary_stencil_parent_cells: 1
    relaxation_e_folding_time_s: 2
    feedback: two_way

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: radiative
    east: radiative
    south: radiative
    north: radiative
  bottom: rigid_slip
  top: rigid

damping:
  enabled: true
  z_d: 9000
  alpha: 0.01
  mode: explicit
  lateral_width: 20
  lateral_alpha: 0.05
  lateral_sponge_enabled: true
  w_only_top_sponge: true
  w_only_depth_cells: 8
  w_only_alpha_max: 0.2

coriolis:
  enabled: false
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: milbrandt
  milbrandt:
    hail_processes: false

turbulence:
  scheme: smagorinsky
  mode: 2d
  Cs: 0.18
  Pr_t: 0.3333333333333333
  Sc_t: 0.3333333333333333

advection:
  scheme: weno5

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: slab
  apply_fluxes: true
  z0m_m: 0.1
  z0h_m: 0.01
  albedo: 0.2
  emissivity: 0.96
  tsk_k: 301
  qsfc_kgkg: 0.014

boundary_layer:
  scheme: slab

radiation:
  scheme: none

terrain:
  scheme: none

initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 3000
    tropopause_m: 10000
    surface_theta_k: 301
    moisture_qv_kgkg: 0.014
  hodograph:
    type: wk_param
    u_sfc_ms: 9
    v_sfc_ms: 1
    u_1km_ms: 14
    v_1km_ms: 6
    u_6km_ms: 28
    v_6km_ms: 22
  trigger:
    type: bubble
    bubble:
      dtheta_k: 4
      radius_km: 3
      center_x_m: 13000
      center_y_m: 9000
      center_z_m: 1500

output:
  preset: dynamics_full
  format: npy_3d
  async_io: false
  live_shm: false

extensions:
  execution:
    mode: qualified
  compute:
    backend: vulkan
    allow_fallback: false
    gpu_apply_microphysics: false
    gpu_apply_slow: false
    gpu_apply_sgs: true
  chaos:
    scheme: full_stochastic
    native_generation_required: true
    seed: 233
    member_id: 0
  diagnostics:
    scientific_every_steps: 1
    deterministic_reductions: true
  validation:
    guard_mode: error
