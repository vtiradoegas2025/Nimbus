# Sustained Cartesian C-grid open-boundary SGS qualification source.
#
# The checked-in source selects full three-dimensional Smagorinsky. The
# qualifier derives one otherwise byte-identical vertical_only branch and
# proves both through continuous/restart and one/four-thread execution. Open
# lateral faces and the upper Neumann face exercise the realized discrete
# traction identity. Full stochastic perturbs the realized transport
# coefficient before the same stability admission.
schema: nimbus.v1

grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 14
  ny: 14
  nz: 18
  dx: 750
  dy: 750
  dz: 250
  ztop: 4500

time:
  run_time: 80
  dt_large: 0.5
  acoustic_substeps: 6
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 80

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: radiative
    east: radiative
    south: radiative
    north: radiative
  bottom: rigid_slip
  top: open

damping:
  enabled: true
  z_d: 3500
  alpha: 0.02
  mode: explicit
  lateral_width: 2
  lateral_alpha: 0.01
  lateral_sponge_enabled: true
  w_only_top_sponge: true
  w_only_depth_cells: 3
  w_only_alpha_max: 0.02

coriolis:
  enabled: false
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: kessler
  shared:
    cloud_water_threshold_kgkg: 0.00002
    autoconversion_rate_s_inv: 0.01
  kessler:
    accretion_coefficient: 2.2
    evaporation_efficiency: 1.0

turbulence:
  scheme: smagorinsky
  mode: 3d
  Cs: 0.18
  Pr_t: 0.3333333333333333
  Sc_t: 0.3333333333333333

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: none
  apply_fluxes: false
  z0m_m: 0.1
  z0h_m: 0.01
  albedo: 0.2
  emissivity: 0.96
  tsk_k: 300

boundary_layer:
  scheme: none

radiation:
  scheme: simple_grey
  solar_forcing: idealized_diurnal
  latitude_deg: 35
  declination_deg: 15
  local_solar_time_at_start_h: 0
  do_lw: true
  do_sw: false
  cadence_s: 10
  clear_sky_only: true
  tau_lw_ref: 2.5
  tau_sw_ref: 0.22
  n_lw: 1
  n_sw: 2

initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 0
    tropopause_m: 8000
    surface_theta_k: 300
    moisture_qv_kgkg: 0.018
  hodograph:
    type: wk_param
    u_sfc_ms: 6
    v_sfc_ms: 2
    u_1km_ms: 8
    v_1km_ms: 3
    u_6km_ms: 14
    v_6km_ms: 6
  trigger:
    type: bubble
    bubble:
      dtheta_k: 2.5
      radius_km: 2.25
      center_x_m: 5250
      center_y_m: 5250
      center_z_m: 1000

output:
  preset: minimal
  format: npy_3d
  async_io: false
  live_shm: false

extensions:
  execution:
    mode: exploratory
    acknowledge_maturity_limits: false
  compute:
    backend: cpu
    gpu_apply_sgs: true
  chaos:
    scheme: full_stochastic
    seed: 235
    member_id: 0
  checkpoint:
    every_s: 40
  diagnostics:
    scientific_every_steps: 1
    deterministic_reductions: true
  validation:
    guard_mode: error
