schema: nimbus.v1

grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 12
  ny: 12
  nz: 16
  dx: 1000
  dy: 1000
  dz: 250
  ztop: 4000

time:
  run_time: 2
  dt_large: 0.2
  acoustic_substeps: 6
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 1

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

advection:
  scheme: tvd

boundary_conditions:
  lateral:
    west: periodic
    east: periodic
    south: periodic
    north: periodic
  bottom: rigid_slip
  top: rigid

damping:
  enabled: false
  z_d: 4000
  alpha: 0
  mode: explicit
  lateral_width: 0
  lateral_alpha: 0
  lateral_sponge_enabled: false
  w_only_top_sponge: false
  w_only_depth_cells: 0
  w_only_alpha_max: 0

coriolis:
  enabled: false
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: kessler
  shared:
    cloud_water_threshold_kgkg: 0.001
    autoconversion_rate_s_inv: 0.001
  kessler:
    accretion_coefficient: 2.2
    evaporation_efficiency: 1

turbulence:
  scheme: none
  mode: 3d
  Cs: 0.18
  Pr_t: 0.7
  Sc_t: 0.7

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: none
  apply_fluxes: false
  z0m_m: 0.1
  z0h_m: 0.01
  albedo: 0.2
  emissivity: 0.96
  tsk_k: 290

boundary_layer:
  scheme: none

radiation:
  scheme: simple_grey
  solar_forcing: idealized_diurnal
  latitude_deg: 0
  declination_deg: 0
  local_solar_time_at_start_h: 12
  do_lw: true
  do_sw: true
  cadence_s: 2
  clear_sky_only: false
  simple_grey_optical_model: absorbing_water_cloud_path_v1
  use_subcycling: true
  subcycle_count: 2
  enable_diagnostics: true
  tau_lw_ref: 2.5
  tau_sw_ref: 0.15
  n_lw: 1
  n_sw: 1
  simple_grey_lw_vapor_absorption_m2kg: 0.02
  simple_grey_lw_liquid_absorption_m2kg: 85
  simple_grey_lw_ice_absorption_m2kg: 45
  simple_grey_sw_vapor_absorption_m2kg: 0.001
  simple_grey_sw_liquid_absorption_m2kg: 20
  simple_grey_sw_ice_absorption_m2kg: 12

initial_conditions:
  sounding:
    type: file
    file_path: tests/fixtures/configs/qualification/soundings/simple_grey_condensing_profile.txt
  hodograph:
    type: wk_param
    u_sfc_ms: 0
    v_sfc_ms: 0
    u_1km_ms: 0
    v_1km_ms: 0
    u_6km_ms: 0
    v_6km_ms: 0
  trigger:
    type: none

output:
  preset: science_validation
  format: npy_3d
  async_io: false
  live_shm: false

radar:
  enabled: false
  products: []

extensions:
  execution:
    mode: qualified
  compute:
    backend: cpu
    allow_fallback: false
  checkpoint:
    every_s: 1
  diagnostics:
    scientific_every_steps: 1
    deterministic_reductions: true
  validation:
    guard_mode: error
