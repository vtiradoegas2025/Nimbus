# Controlled Cartesian C-grid coupled-physics qualification fixture.
#
# This is deliberately smaller and cleaner than cart_cgrid_full_physics.yaml.
# It exercises the first admitted production-order combination while retaining
# independently attributable forcing:
#   Kessler warm-rain microphysics
#   slab surface/PBL column physics
#   horizontal-only Smagorinsky SGS (PBL owns vertical mixing)
#   simple-grey longwave radiation
#
# Periodic lateral boundaries, zero explicit diffusion, zero Coriolis, and zero
# sponge remove unrelated wall impulses and boundary/source terms. The
# non-integral 0.7-s macro step
# crosses the 1/10/60-s SGS/radiation/PBL clocks late and therefore detects
# cadence phase drift.  A checkpoint is emitted at 35 s for branch/restart
# equivalence qualification.
schema: nimbus.v1

grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 12
  ny: 12
  nz: 16
  dx: 1000
  dy: 1000
  dz: 250
  ztop: 4000

time:
  run_time: 140
  dt_large: 0.7
  acoustic_substeps: 6
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 140

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: periodic
    east: periodic
    south: periodic
    north: periodic
  bottom: rigid_slip
  top: rigid

damping:
  enabled: false
  z_d: 4000
  alpha: 0
  mode: explicit
  lateral_width: 0
  lateral_alpha: 0
  lateral_sponge_enabled: false
  w_only_top_sponge: false
  w_only_depth_cells: 0
  w_only_alpha_max: 0

coriolis:
  enabled: false
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: kessler
  # Lower the cloud-to-rain threshold only for this compact 70-s fixture so
  # warm-rain conversion and sedimentation become observably active without a
  # many-minute storm spin-up. The values remain explicit scheme inputs, not a
  # hidden qualification hook.
  shared:
    cloud_water_threshold_kgkg: 0.00001
    autoconversion_rate_s_inv: 0.02
  kessler:
    accretion_coefficient: 2.2
    evaporation_efficiency: 1.0

turbulence:
  scheme: smagorinsky
  mode: 2d
  Cs: 0.18
  Pr_t: 0.3333333333333333
  Sc_t: 0.3333333333333333

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: slab
  apply_fluxes: true
  z0m_m: 0.1
  z0h_m: 0.01
  albedo: 0.2
  emissivity: 0.96
  tsk_k: 302
  qsfc_kgkg: 0.016

boundary_layer:
  scheme: slab

radiation:
  scheme: simple_grey
  solar_forcing: idealized_diurnal
  latitude_deg: 35
  declination_deg: 15
  local_solar_time_at_start_h: 0
  do_lw: true
  do_sw: false
  cadence_s: 10
  clear_sky_only: true
  tau_lw_ref: 2.5
  tau_sw_ref: 0.22
  n_lw: 1
  n_sw: 2

initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 0
    tropopause_m: 8000
    surface_theta_k: 300
    moisture_qv_kgkg: 0.020
  hodograph:
    type: wk_param
    u_sfc_ms: 5
    v_sfc_ms: 2
    u_1km_ms: 5
    v_1km_ms: 2
    u_6km_ms: 5
    v_6km_ms: 2
  trigger:
    type: bubble
    bubble:
      dtheta_k: 2
      radius_km: 2.5
      center_x_m: 6000
      center_y_m: 6000
      center_z_m: 1000

output:
  preset: minimal
  format: npy_3d
  async_io: false
  live_shm: false

extensions:
  execution:
    mode: exploratory
    acknowledge_maturity_limits: false
  compute:
    backend: cpu
  checkpoint:
    every_s: 70
  diagnostics:
    scientific_every_steps: 1
    deterministic_reductions: true
  validation:
    guard_mode: error
