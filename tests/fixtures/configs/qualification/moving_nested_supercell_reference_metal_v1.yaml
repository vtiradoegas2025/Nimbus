schema: nimbus.v1

# Oversized stationary physical-Metal reference for the exact v12 moving-nest
# science tuple. Geometry, numerics, physics, initial state, and diagnostic
# cadence match moving_nested_supercell_reference_v5.yaml. Only compute
# ownership and checkpoint cadence differ: fallback is prohibited, SGS state
# application is native, and Kessler/slow state commits remain host-owned.
grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 269
  ny: 215
  nz: 50
  dx: 600
  dy: 600
  dz: 320
  ztop: 16000

time:
  run_time: 4500
  dt_large: 0.75
  acoustic_substeps: 8
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 450

domain_motion:
  mode: stationary
  lifetime_planning:
    enabled: true
    action: error
    motion_source: explicit
    explicit_u_ms: 19.2
    explicit_v_ms: 12.5
    upstream_buffer_m: 10000
    downstream_buffer_m: 20000
    cross_track_buffer_m: 15000
    motion_uncertainty_ms: 3
  tracking:
    enabled: true
    recycle_domain: false
    interval_s: 30
    inner_margin_m: 10000
    maximum_shift_cells: 8
    cooldown_s: 300
    minimum_confidence: 0.65
    minimum_updraft_ms: 5
    minimum_condensate_path_kgm2: 0.1
    updraft_helicity_bottom_m_agl: 2000
    updraft_helicity_top_m_agl: 5000
    minimum_absolute_updraft_helicity_m2s2: 25
    minimum_component_cells: 4
    maximum_motion_speed_ms: 75
    maximum_motion_acceleration_ms2: 0.25
    minimum_continuity_samples: 3
    lost_after_samples: 3
    topology_confirmation_samples: 2
    branch_preference: bunkers_right
    branch_velocity_uncertainty_ms: 3

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: radiative
    east: radiative
    south: radiative
    north: radiative
  bottom: rigid_slip
  top: rigid

damping:
  enabled: true
  z_d: 14000
  alpha: 0.00333
  mode: explicit
  lateral_width: 10
  lateral_alpha: 0.05
  lateral_sponge_enabled: true
  w_only_top_sponge: true
  w_only_depth_cells: 8
  w_only_alpha_max: 0.2

coriolis:
  enabled: true
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: kessler
  shared:
    cloud_water_threshold_kgkg: 0.001
    autoconversion_rate_s_inv: 0.001
  kessler:
    accretion_coefficient: 2.2
    evaporation_efficiency: 1.0

turbulence:
  scheme: smagorinsky
  mode: 3d
  Cs: 0.18
  Pr_t: 0.3333333333333333
  Sc_t: 0.3333333333333333

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: none
  apply_fluxes: false

boundary_layer:
  scheme: none

radiation:
  scheme: none

terrain:
  scheme: none

initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 3000
    tropopause_m: 12000
    surface_theta_k: 301
    moisture_qv_kgkg: 0.012
  hodograph:
    type: wk_param
    u_sfc_ms: 4
    v_sfc_ms: 1
    u_1km_ms: 14
    v_1km_ms: 6
    u_6km_ms: 28
    v_6km_ms: 22
  trigger:
    type: bubble
    bubble:
      dtheta_k: 4
      radius_km: 4
      center_x_m: 26000
      center_y_m: 20000
      center_z_m: 1500

output:
  preset: science_validation
  format: npy_3d
  async_io: false
  live_shm: false
  qualification_diagnostics:
    preset: moving_reference_v1
    interval_s: 30

extensions:
  execution:
    mode: exploratory
    acknowledge_maturity_limits: false
  compute:
    backend: metal
    allow_fallback: false
    gpu_apply_microphysics: false
    gpu_apply_slow: false
    gpu_apply_sgs: true
  checkpoint:
    every_s: 450
  diagnostics:
    scientific_every_steps: 10
    deterministic_reductions: true
  validation:
    guard_mode: error
