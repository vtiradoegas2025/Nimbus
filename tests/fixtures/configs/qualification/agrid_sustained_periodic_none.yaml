# Sustained A-grid dynamics control for the radiation matrix. Horizontally
# uniform, periodic, and radiation-free so any horizontal structure or 2 dz
# vertical wind is a dynamics defect rather than boundary forcing or heating.
schema: nimbus.v1

grid:
  coordinate_system: cartesian
  staggering: collocated
  nx: 10
  ny: 10
  nz: 12
  dx: 2000
  dy: 2000
  dz: 500
  ztop: 6000

time:
  run_time: 3600
  dt_large: 0.2
  acoustic_substeps: 6
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 3600

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_agrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: periodic
    east: periodic
    south: periodic
    north: periodic
  bottom: rigid_slip
  top: rigid

damping:
  enabled: false
  z_d: 6000
  alpha: 0
  mode: explicit
  lateral_width: 0
  lateral_alpha: 0
  lateral_sponge_enabled: false
  w_only_top_sponge: false
  w_only_depth_cells: 0
  w_only_alpha_max: 0

coriolis:
  enabled: false
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: none

turbulence:
  scheme: none
  mode: 3d
  Cs: 0.18
  Pr_t: 0.7
  Sc_t: 0.7

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: none
  apply_fluxes: false
  z0m_m: 0.1
  z0h_m: 0.01
  albedo: 0.2
  emissivity: 0.96
  tsk_k: 290

boundary_layer:
  scheme: none

radiation:
  scheme: none

initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 0
    tropopause_m: 8000
    surface_theta_k: 300
    moisture_qv_kgkg: 0.004
  hodograph:
    type: wk_param
    u_sfc_ms: 0
    v_sfc_ms: 0
    u_1km_ms: 0
    v_1km_ms: 0
    u_6km_ms: 0
    v_6km_ms: 0
  trigger:
    type: none

output:
  preset: minimal
  format: npy_3d
  async_io: false
  live_shm: false

extensions:
  execution:
    mode: exploratory
    acknowledge_maturity_limits: false
  compute:
    backend: cpu
  diagnostics:
    scientific_every_steps: 0
    deterministic_reductions: true
  validation:
    guard_mode: error
