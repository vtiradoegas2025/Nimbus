schema: nimbus.v1

# Qualified bounded-error ZFP history fixture. This is history/publication,
# never a restart checkpoint. Only the eight fields with unit-aware absolute
# error budgets are admitted; all extra prefilter loss is disabled.
grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 16
  ny: 16
  nz: 12
  dx: 2000
  dy: 2000
  dz: 500
  ztop: 6000

time:
  run_time: 20
  dt_large: 2.0
  acoustic_substeps: 6
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 10

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: radiative
    east: radiative
    south: radiative
    north: radiative
  bottom: rigid_slip
  top: rigid

damping:
  enabled: false
  z_d: 5000
  alpha: 0.00333
  mode: explicit
  lateral_width: 0
  lateral_alpha: 0
  lateral_sponge_enabled: false
  w_only_top_sponge: false
  w_only_depth_cells: 0
  w_only_alpha_max: 0

coriolis:
  enabled: false
  mode: f_plane

microphysics:
  scheme: none

turbulence:
  scheme: none
  mode: 3d
  Cs: 0.18
  Pr_t: 0.7
  Sc_t: 0.7

advection:
  scheme: tvd

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: none
  apply_fluxes: false

boundary_layer:
  scheme: none

radiation:
  scheme: none

initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 0
    tropopause_m: 8000
    surface_theta_k: 300
    moisture_qv_kgkg: 0.004
  hodograph:
    type: wk_param
    u_sfc_ms: 0
    v_sfc_ms: 0
    u_1km_ms: 0
    v_1km_ms: 0
    u_6km_ms: 0
    v_6km_ms: 0
  trigger:
    type: none

output:
  preset: minimal
  format: zfp_high
  async_io: true
  live_shm: false
  zfp_mode: accuracy
  zfp_keyframe_interval: 4
  zfp_predictive_delta: true
  zfp_field_execution: serial
  zfp_field_workers: 0
  zfp_field_scratch_mib: 64
  zfp_sparse_threshold: 0
  zfp_float16_prefilter: false
  zfp_per_field_tolerances: true
  zfp_field_tolerance:
    u: 1.0e-4
    v: 1.0e-4
    w: 1.0e-4
    theta: 1.0e-3
    p: 5.0e-2
    rho: 1.0e-6
    qv: 1.0e-8
    qr: 1.0e-8
  keep_last_frames: 3
  minimum_free_space_mib: 4096
  maximum_retained_history_files: 256

extensions:
  execution:
    mode: qualified
  compute:
    backend: cpu
  diagnostics:
    scientific_every_steps: 0
  validation:
    guard_mode: error
