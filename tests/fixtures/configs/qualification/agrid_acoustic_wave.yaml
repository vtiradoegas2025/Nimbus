# Internal production-integrator A-grid acoustic-wave qualification.
schema: nimbus.v1
grid:
  coordinate_system: cartesian
  staggering: collocated
  nx: 34
  ny: 6
  nz: 10
  dx: 1000
  dy: 1000
  dz: 500
  ztop: 5000
time:
  run_time: 24
  dt_large: 0.6
  acoustic_substeps: 6
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 24
dynamics:
  scheme: klemp_wilhelmson_split_cartesian_agrid
  axisymmetric: false
boundary_conditions:
  lateral:
    west: periodic
    east: periodic
    south: periodic
    north: periodic
  bottom: rigid_slip
  top: rigid
damping:
  enabled: false
  z_d: 5000
  alpha: 0
  mode: explicit
  lateral_width: 0
  lateral_alpha: 0
  lateral_sponge_enabled: false
  w_only_top_sponge: false
  w_only_depth_cells: 0
  w_only_alpha_max: 0
coriolis:
  enabled: false
  mode: f_plane
  latitude_deg: 35
microphysics:
  scheme: none
turbulence:
  scheme: none
  mode: 3d
  Cs: 0.18
  Pr_t: 0.7
  Sc_t: 0.7
diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars
surface:
  scheme: none
  apply_fluxes: false
boundary_layer:
  scheme: none
radiation:
  scheme: none
initial_conditions:
  sounding:
    type: file
    file_path: tests/fixtures/configs/qualification/soundings/moist_isothermal_profile.txt
  hodograph:
    type: wk_param
    u_sfc_ms: 0
    v_sfc_ms: 0
    u_1km_ms: 0
    v_1km_ms: 0
    u_6km_ms: 0
    v_6km_ms: 0
  trigger:
    type: none
output:
  preset: minimal
  format: npy_3d
  async_io: false
  live_shm: false
extensions:
  execution:
    mode: exploratory
    acknowledge_maturity_limits: false
  compute:
    backend: cpu
  diagnostics:
    scientific_every_steps: 1
  validation:
    guard_mode: error
