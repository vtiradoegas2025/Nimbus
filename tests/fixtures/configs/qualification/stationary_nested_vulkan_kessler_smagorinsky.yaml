schema: nimbus.v1

grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 16
  ny: 16
  nz: 24
  dx: 1000
  dy: 1000
  dz: 500
  ztop: 12000

time:
  run_time: 4
  dt_large: 0.5
  acoustic_substeps: 6
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 2

domain_motion:
  mode: stationary
  lifetime_planning:
    enabled: false
  tracking:
    enabled: false
    recycle_domain: false
  nesting:
    enabled: true
    parent_ratio_x: 2
    parent_ratio_y: 2
    parent_time_step_ratio: 2
    child_origin_parent_cell_i: 5
    child_origin_parent_cell_j: 5
    child_cells_x: 8
    child_cells_y: 8
    relaxation_width_child_cells: 1
    boundary_stencil_parent_cells: 1
    relaxation_e_folding_time_s: 2
    feedback: one_way

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: zero_gradient
    east: zero_gradient
    south: zero_gradient
    north: zero_gradient
  bottom: rigid_slip
  top: rigid

damping:
  enabled: false
  z_d: 12000
  alpha: 0
  mode: explicit
  lateral_width: 0
  lateral_alpha: 0
  lateral_sponge_enabled: false
  w_only_top_sponge: false
  w_only_depth_cells: 0
  w_only_alpha_max: 0

coriolis:
  enabled: false
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: kessler
  shared:
    cloud_water_threshold_kgkg: 0.001
    autoconversion_rate_s_inv: 0.001
  kessler:
    accretion_coefficient: 2.2
    evaporation_efficiency: 1.0

turbulence:
  scheme: smagorinsky
  mode: 3d
  Cs: 0.18
  Pr_t: 0.3333333333333333
  Sc_t: 0.3333333333333333

advection:
  scheme: tvd

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: none
  apply_fluxes: false

boundary_layer:
  scheme: none

radiation:
  scheme: none

terrain:
  scheme: none

initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 3000
    tropopause_m: 8000
    surface_theta_k: 300
    moisture_qv_kgkg: 0.020
  hodograph:
    type: wk_param
    u_sfc_ms: 4
    v_sfc_ms: -2
    u_1km_ms: 8
    v_1km_ms: 1
    u_6km_ms: 18
    v_6km_ms: 8
  trigger:
    type: bubble
    bubble:
      # This shallow cold perturbation is a bounded process fixture: cooling
      # the 95%-RH column initiates condensation and bottom-cell warm-rain
      # fallout within four seconds. It is not a storm-lifetime experiment.
      dtheta_k: -8
      radius_km: 3
      center_x_m: 8000
      center_y_m: 8000
      center_z_m: 250

output:
  preset: minimal
  format: npy_3d
  async_io: false
  live_shm: false

extensions:
  execution:
    mode: qualified
  compute:
    backend: vulkan
    allow_fallback: false
    gpu_apply_microphysics: true
    gpu_apply_sgs: true
  chaos:
    scheme: none
  diagnostics:
    scientific_every_steps: 1
    deterministic_reductions: true
  validation:
    guard_mode: error
