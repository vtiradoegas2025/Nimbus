# Flat CPU A-grid constant-translation Ready representative. The qualification
# matrix constructs a stationary Galilean counterpart by subtracting the
# declared frame velocity from every Earth-relative hodograph wind.
schema: nimbus.v1

grid:
  coordinate_system: cartesian
  staggering: collocated
  nx: 12
  ny: 12
  nz: 16
  dx: 1000
  dy: 1000
  dz: 250
  ztop: 4000

time:
  run_time: 20
  dt_large: 0.1
  acoustic_substeps: 6
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 20

domain_motion:
  mode: constant_velocity
  frame_velocity:
    u_ms: 7
    v_ms: -3

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_agrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: periodic
    east: periodic
    south: periodic
    north: periodic
  bottom: rigid_slip
  top: rigid

damping:
  enabled: false
  z_d: 4000
  alpha: 0
  mode: explicit
  lateral_width: 0
  lateral_alpha: 0
  lateral_sponge_enabled: false
  w_only_top_sponge: false
  w_only_depth_cells: 0
  w_only_alpha_max: 0

coriolis:
  enabled: true
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: lin
  shared:
    cloud_water_threshold_kgkg: 0.0001
    autoconversion_rate_s_inv: 0.01
  lin:
    accretion_coefficient: 2.2
    evaporation_rate_s_inv: 0.001

turbulence:
  scheme: smagorinsky
  mode: 2d
  Cs: 0.18
  Pr_t: 0.3333333333333333
  Sc_t: 0.3333333333333333

advection:
  scheme: weno5

diffusion:
  scheme: implicit
  operator_order: 2
  K_h: 4000
  K_v: 4000
  apply_to: scalars_and_momentum

surface:
  scheme: none
  apply_fluxes: false
  z0m_m: 0.1
  z0h_m: 0.01
  albedo: 0.2
  emissivity: 0.96
  tsk_k: 300
  qsfc_kgkg: 0.014

boundary_layer:
  scheme: none

radiation:
  scheme: rrtmg
  solar_forcing: idealized_diurnal
  latitude_deg: 35
  declination_deg: 15
  local_solar_time_at_start_h: 0
  do_lw: true
  do_sw: false
  cadence_s: 1
  clear_sky_only: true
  rrtmg_ozone_vmr: 0.000004

initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 0
    tropopause_m: 8000
    surface_theta_k: 300
    moisture_qv_kgkg: 0.004
  hodograph:
    type: wk_param
    u_sfc_ms: 12
    v_sfc_ms: -1
    u_1km_ms: 12
    v_1km_ms: -1
    u_6km_ms: 12
    v_6km_ms: -1
  trigger:
    type: bubble
    bubble:
      dtheta_k: 2
      cloud_water_kgkg: 0.001
      radius_km: 2.5
      center_x_m: 6000
      center_y_m: 6000
      center_z_m: 1000

output:
  preset: minimal
  format: npy_3d
  async_io: false
  live_shm: false

extensions:
  execution:
    mode: qualified
  compute:
    backend: cpu
    allow_fallback: false
  diagnostics:
    scientific_every_steps: 1
    deterministic_reductions: true
  validation:
    guard_mode: error
