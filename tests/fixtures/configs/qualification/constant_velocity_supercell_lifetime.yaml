schema: nimbus.v1

# D2 long-storm translating-domain candidate. This preserves the D1 sounding,
# hodograph, trigger, dynamics, physics, and 4,500 s duration while replacing
# the 267 x 208 oversized corridor with a 270 x 248 constant translating
# window. The first moving pilot used the D1 planning vector (19.2, 12.5) m/s,
# but 63 coherent Earth-frame samples from 450--2,310 s fit (26.2743, 17.388)
# m/s and left only 10.2 km clearance. The committed frame rounds that
# independent pilot fit to (26.3, 17.4) m/s and restarts from initialization.
# A second pilot kept the core centered but the mature finite condensate/cold-
# pool envelope reached 6 km clearance at 2,250 s in the original 70.8 km
# window. A 94.8 km square pilot then resolved the directional requirement:
# by 2,850 s its envelope spanned 79.2 km x 66.6 km, leaving only 7.2--8.4 km
# east/west/north but 21 km south. A 118.8 x 106.8 km directional candidate
# then held the core near its target but failed the unchanged 10 km finite-
# envelope margin north at 2,400 s and east at 2,610 s; later samples were no
# longer valid sizing evidence because the storm envelope was already inside
# the protected boundary zone. The committed 136.8 x 123.6 km physical
# footprint first retained the same trigger and added reserve east/north. That
# pilot exposed the complementary early-lifetime extreme at 1,710 s: the
# connected envelope left 9.6/10.2 km west/south while more than 62 km remained
# east/north. A first 9 km shift removed that boundary-sensitive connection;
# complete 64-candidate association then followed the target through 2,850 s
# before its physically coherent 85 x 71 km complex connected, leaving only
# 6.0/6.6 km west/south and about 46 km east/north at 2,880 s. The committed
# trigger was shifted 18 km east/north in total. That placement exposed the
# complementary late northeast extreme: 9.6 km north at 2,430 s and 8.4 km
# east/north at 2,640 s, while west/south retained at least 45 km. The committed
# footprint first added 12 km east/north. The broad-complex transition then
# reproduced at exactly 6.0/7.8 km west/south, showing that its hydrometeor
# envelope genuinely reached the lateral sponge rather than following the
# shifted trigger. The committed footprint therefore adds 12 km on every
# effective face and shifts the trigger with the west/south reserve. This
# case's storm complex is broad enough that the translating allocation is
# 20.57% larger in horizontal cell count than D1; no false footprint reduction
# is claimed. It retains the
# planner's 3 m/s uncertainty expansion and 10/20/15 km buffers without
# recycling or inventing atmosphere. It remains a candidate until the
# maintained long-storm comparison passes.
grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 270
  ny: 248
  nz: 50
  dx: 600
  dy: 600
  dz: 320
  ztop: 16000

time:
  run_time: 4500
  dt_large: 1.5
  acoustic_substeps: 8
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 450

domain_motion:
  mode: constant_velocity
  frame_velocity:
    u_ms: 26.3
    v_ms: 17.4
  lifetime_planning:
    enabled: true
    action: error
    motion_source: explicit
    explicit_u_ms: 26.3
    explicit_v_ms: 17.4
    upstream_buffer_m: 10000
    downstream_buffer_m: 20000
    cross_track_buffer_m: 15000
    motion_uncertainty_ms: 3
  tracking:
    enabled: true
    interval_s: 30
    inner_margin_m: 10000
    maximum_shift_cells: 8
    cooldown_s: 300
    minimum_confidence: 0.65
    # Severe-storm motion cores use 10 m/s so transient 5 m/s turbulent
    # bridges beneath a shared MCS anvil do not become one aggregate track.
    # The independently configured 0.1 kg/m2 condensate threshold still owns
    # the watershed cloud envelope around every retained core.
    minimum_updraft_ms: 10
    minimum_condensate_path_kgm2: 0.1
    updraft_helicity_bottom_m_agl: 2000
    updraft_helicity_top_m_agl: 5000
    minimum_absolute_updraft_helicity_m2s2: 25
    minimum_component_cells: 4
    # Four square kilometres is invariant with grid refinement (12 columns at
    # this 600 m spacing); the four-cell floor remains a cheap noise rejector.
    minimum_core_area_m2: 4000000
    maximum_motion_speed_ms: 75
    maximum_motion_acceleration_ms2: 0.25
    minimum_continuity_samples: 3
    lost_after_samples: 3
    topology_confirmation_samples: 2
    branch_preference: bunkers_right
    branch_velocity_uncertainty_ms: 3

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: radiative
    east: radiative
    south: radiative
    north: radiative
  bottom: rigid_slip
  top: rigid

damping:
  enabled: true
  z_d: 14000
  alpha: 0.00333
  mode: explicit

coriolis:
  enabled: true
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: kessler

turbulence:
  scheme: smagorinsky
  mode: 3d
  Cs: 0.18
  Pr_t: 0.3333333333333333
  Sc_t: 0.3333333333333333

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: none
  apply_fluxes: false

boundary_layer:
  scheme: none

radiation:
  scheme: none

terrain:
  scheme: none

initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 3000
    tropopause_m: 12000
    surface_theta_k: 301
    moisture_qv_kgkg: 0.012
  hodograph:
    type: wk_param
    u_sfc_ms: 4
    v_sfc_ms: 1
    u_1km_ms: 14
    v_1km_ms: 6
    u_6km_ms: 28
    v_6km_ms: 22
  trigger:
    type: bubble
    bubble:
      dtheta_k: 4
      radius_km: 4
      center_x_m: 85800
      center_y_m: 75600
      center_z_m: 1500

output:
  preset: minimal
  format: npy_3d
  async_io: true
  live_shm: false

extensions:
  execution:
    mode: exploratory
    acknowledge_maturity_limits: false
  compute:
    backend: cpu
  checkpoint:
    every_s: 2250
  diagnostics:
    scientific_every_steps: 10
    deterministic_reductions: true
  validation:
    guard_mode: error
