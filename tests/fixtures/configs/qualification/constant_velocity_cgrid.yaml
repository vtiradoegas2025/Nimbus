# D2 constant-translation CPU qualification fixture. The companion script
# constructs a stationary Galilean counterpart by subtracting the declared
# frame velocity from every Earth-relative hodograph wind. With Coriolis,
# surface drag, terrain, and lateral boundary impulses absent, all grid-frame
# prognostic evolution must agree while published horizontal winds retain the
# exact Earth-frame velocity offset.
schema: nimbus.v1

grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 12
  ny: 12
  nz: 16
  dx: 1000
  dy: 1000
  dz: 250
  ztop: 4000

time:
  run_time: 20
  dt_large: 1.0
  acoustic_substeps: 6
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 20

domain_motion:
  mode: constant_velocity
  frame_velocity:
    u_ms: 7
    v_ms: -3

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: periodic
    east: periodic
    south: periodic
    north: periodic
  bottom: rigid_slip
  top: rigid

damping:
  enabled: false
  z_d: 4000
  alpha: 0
  mode: explicit
  lateral_width: 0
  lateral_alpha: 0
  lateral_sponge_enabled: false
  w_only_top_sponge: false
  w_only_depth_cells: 0
  w_only_alpha_max: 0

coriolis:
  enabled: false
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: kessler
  shared:
    cloud_water_threshold_kgkg: 0.00001
    autoconversion_rate_s_inv: 0.02

turbulence:
  scheme: smagorinsky
  mode: 2d
  Cs: 0.18
  Pr_t: 0.3333333333333333
  Sc_t: 0.3333333333333333

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 2
  K_v: 1
  apply_to: scalars

surface:
  scheme: none
  apply_fluxes: false
  z0m_m: 0.1
  z0h_m: 0.01
  albedo: 0.2
  emissivity: 0.96
  tsk_k: 300
  qsfc_kgkg: 0.014

boundary_layer:
  scheme: none

radiation:
  scheme: simple_grey
  solar_forcing: idealized_diurnal
  latitude_deg: 35
  declination_deg: 15
  local_solar_time_at_start_h: 0
  do_lw: true
  do_sw: false
  cadence_s: 5
  clear_sky_only: true
  tau_lw_ref: 2.5
  tau_sw_ref: 0.22
  n_lw: 1
  n_sw: 2

initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 0
    tropopause_m: 8000
    surface_theta_k: 300
    moisture_qv_kgkg: 0.020
  hodograph:
    type: wk_param
    u_sfc_ms: 12
    v_sfc_ms: -1
    u_1km_ms: 12
    v_1km_ms: -1
    u_6km_ms: 12
    v_6km_ms: -1
  trigger:
    type: bubble
    bubble:
      dtheta_k: 2
      radius_km: 2.5
      center_x_m: 6000
      center_y_m: 6000
      center_z_m: 1000

output:
  preset: minimal
  format: npy_3d
  async_io: false
  live_shm: false

extensions:
  execution:
    mode: exploratory
    acknowledge_maturity_limits: false
  compute:
    backend: cpu
    allow_fallback: false
  diagnostics:
    scientific_every_steps: 1
    deterministic_reductions: true
  validation:
    guard_mode: error
