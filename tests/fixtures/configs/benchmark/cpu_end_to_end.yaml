schema: nimbus.v1

# CPU end-to-end companion to benchmark.yaml. It uses the same neutral
# no-slab physics profile but includes presentation output, asynchronous
# snapshot publication, derived products, and periodic scientific budgets.
# Compare process wall time and output throughput separately from the solver
# step metric; the latter intentionally excludes snapshot work.
grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 128
  ny: 128
  nz: 64
  dx: 500
  dy: 500
  dz: 300
  ztop: 19200

time:
  run_time: 120
  dt_large: 1.0
  acoustic_substeps: 8
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 30

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: radiative
    east: radiative
    south: radiative
    north: radiative
  bottom: rigid_slip
  top: rigid

damping:
  enabled: true
  z_d: 13400
  alpha: 0.05
  mode: explicit

coriolis:
  enabled: true
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: kessler

turbulence:
  scheme: smagorinsky
  mode: 3d
  Cs: 0.18

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: none
  apply_fluxes: false

boundary_layer:
  scheme: none

radiation:
  scheme: none

initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 3000
    tropopause_m: 12000
    surface_theta_k: 301
    moisture_qv_kgkg: 0.012
  hodograph:
    type: wk_param
    u_sfc_ms: 4.0
    v_sfc_ms: 1.0
    u_1km_ms: 14.0
    v_1km_ms: 6.0
    u_6km_ms: 28.0
    v_6km_ms: 22.0
  trigger:
    type: bubble
    bubble:
      dtheta_k: 4
      radius_km: 4
      center_x_m: 32000
      center_y_m: 32000
      center_z_m: 1500

output:
  preset: presentation
  format: npy_3d
  async_io: true
  live_shm: false

extensions:
  compute:
    backend: cpu
  diagnostics:
    scientific_every_steps: 10
  performance:
    timing: true
    report_every_steps: 0
    warmup_steps: 20
  validation:
    guard_mode: warn
