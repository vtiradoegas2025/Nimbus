# Release-like CPU timing/allocation fixture for mapped terrain shortwave.
# Four model steps warm every retained transactional buffer rotation. Six
# measured steps each execute one complete daytime radiation cadence; file output,
# scientific diagnostics, and validation sweeps stay outside the measurement.
schema: nimbus.v1

grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 16
  ny: 16
  nz: 20
  dx: 500
  dy: 500
  dz: 500
  ztop: 10000

time:
  run_time: 10
  dt_large: 1
  acoustic_substeps: 6
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 0

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: radiative
    east: radiative
    south: radiative
    north: radiative
  bottom: rigid_slip
  top: rigid

damping:
  enabled: false
  z_d: 10000
  alpha: 0
  mode: explicit
  lateral_width: 0
  lateral_alpha: 0
  lateral_sponge_enabled: false
  w_only_top_sponge: false
  w_only_depth_cells: 0
  w_only_alpha_max: 0

coriolis:
  enabled: false
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: kessler

turbulence:
  scheme: smagorinsky
  mode: 3d
  Cs: 0.18
  Pr_t: 0.7
  Sc_t: 0.7

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: none
  apply_fluxes: false
  z0m_m: 0.1
  z0h_m: 0.01
  albedo: 0.2
  emissivity: 0.96
  tsk_k: 300
  qsfc_kgkg: 0.014

boundary_layer:
  scheme: none

radiation:
  scheme: simple_grey
  solar_forcing: idealized_diurnal
  latitude_deg: 35
  declination_deg: 15
  local_solar_time_at_start_h: 12
  do_lw: true
  do_sw: true
  cadence_s: 1
  clear_sky_only: true
  tau_lw_ref: 2.5
  tau_sw_ref: 0.22
  n_lw: 1
  n_sw: 2
  terrain_sw_cosine_nodes: 4
  terrain_sw_azimuth_nodes: 8
  terrain_sw_maximum_bounces: 32
  terrain_sw_relative_residual_tolerance: 1.0e-10
  terrain_sw_absolute_residual_tolerance_w: 1.0e-9

terrain:
  scheme: bell
  coordinate: smoothed
  compute_derivatives: true
  compute_metrics: true
  smoothing_decay: 0.1
  bell:
    h0: 300
    a: 2000
    axisymmetric: true

initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 800
    tropopause_m: 8000
    surface_theta_k: 300
    moisture_qv_kgkg: 0.014
  hodograph:
    type: wk_param
    u_sfc_ms: 2
    v_sfc_ms: 0
    u_1km_ms: 4
    v_1km_ms: 1
    u_6km_ms: 10
    v_6km_ms: 4
  trigger:
    type: bubble
    bubble:
      dtheta_k: 1
      radius_km: 1.5
      center_x_m: 4000
      center_y_m: 4000
      center_z_m: 1500

output:
  preset: minimal
  format: npy_3d
  async_io: false
  live_shm: false

extensions:
  execution:
    mode: exploratory
    acknowledge_maturity_limits: false
  compute:
    backend: cpu
  diagnostics:
    scientific_every_steps: 0
    deterministic_reductions: true
  performance:
    timing: true
    report_every_steps: 0
    warmup_steps: 4
  validation:
    guard_mode: off
