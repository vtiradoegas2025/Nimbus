schema: nimbus.v1

# BEAST -- maximum-resolution Cartesian C-grid WK supercell, sized to the 48 GB
# memory budget. 640 x 640 x 200 = 81.9M cells at dx=dy=250 m, dz=100 m:
# a 160 x 160 km domain resolved to 250 m horizontally and 100 m vertically up
# to 20 km. Peak RAM ~35 GB (measured ~345 bytes/cell of fields + the async
# output snapshot); leaves headroom on a 48 GB machine.
#
# This will peg every core for HOURS on CPU (the Cartesian C-grid has no GPU
# path yet -- backend stays cpu). Each output frame is ~2.6 GB on disk
# (8 fields x 81.9M x 4 B); output_interval=300 writes ~6 frames (~16 GB).
# Lower output_interval for a smoother video at higher disk cost; raise nx/ny/nz
# toward ~95M cells (~42 GB) to push closer to the 48 GB ceiling.
grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 640
  ny: 640
  nz: 200
  dx: 250
  dy: 250
  dz: 100
  ztop: 20000

time:
  run_time: 1800
  dt_large: 0.5
  acoustic_substeps: 8
  adaptive_dt: false
  cfl_safety: 0.6
  output_interval: 300

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

boundary_conditions:
  lateral:
    west: radiative
    east: radiative
    south: radiative
    north: radiative
  bottom: rigid_slip
  top: rigid

damping:
  enabled: true
  z_d: 14000
  alpha: 0.05
  mode: explicit

coriolis:
  enabled: true
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: kessler

turbulence:
  scheme: smagorinsky
  # PBL owns vertical mixing; SGS is horizontal-only to avoid double counting.
  mode: 2d
  Cs: 0.18
  Pr_t: 0.7
  Sc_t: 0.7

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: slab
  apply_fluxes: true

boundary_layer:
  scheme: slab

radiation:
  scheme: none

initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 3000
    tropopause_m: 12000
    surface_theta_k: 301
    moisture_qv_kgkg: 0.012
  hodograph:
    type: wk_param
    u_sfc_ms: 4.0
    v_sfc_ms: 1.0
    u_1km_ms: 14.0
    v_1km_ms: 6.0
    u_6km_ms: 28.0
    v_6km_ms: 22.0
  trigger:
    type: bubble
    bubble:
      dtheta_k: 4
      radius_km: 4
      center_x_m: 80000
      center_y_m: 80000
      center_z_m: 1500

output:
  preset: presentation
  format: npy_3d
  async_io: true
  live_shm: false

extensions:
  compute:
    # Active PBL is CPU-only; do not imply an unqualified hybrid backend.
    backend: cpu
  validation:
    guard_mode: off
