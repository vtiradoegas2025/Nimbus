schema: nimbus.v1
grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 512
  ny: 512
  nz: 160
  dx: 100
  dy: 100
  dz: 100
  ztop: 16000
time:
  run_time: 5400
  dt_large: 0.8
  acoustic_substeps: 14
  adaptive_dt: false
  cfl_safety: 0.4
  output_interval: 60
dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false
boundary_conditions:
  lateral:
    west: radiative
    east: radiative
    south: radiative
    north: radiative
  bottom: rigid_slip
  top: rigid
damping:
  enabled: true
  z_d: 14000
  alpha: 0.00333
  mode: explicit
coriolis:
  enabled: true
  mode: f_plane
  latitude_deg: 35
microphysics:
  scheme: lin
turbulence:
  scheme: smagorinsky
  # PBL owns vertical mixing; SGS is horizontal-only to avoid double counting.
  mode: 2d
  Cs: 0.18
  Pr_t: 0.3333
  Sc_t: 0.3333
diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars
surface:
  scheme: slab
  apply_fluxes: true
boundary_layer:
  scheme: slab
radiation:
  scheme: none
initial_conditions:
  sounding:
    type: parametric_cape
    cape_jkg: 4000
    tropopause_m: 13000
    surface_theta_k: 302
    moisture_qv_kgkg: 0.016
  hodograph:
    type: wk_param
    u_sfc_ms: 4
    v_sfc_ms: 1
    u_1km_ms: 14
    v_1km_ms: 6
    u_6km_ms: 28
    v_6km_ms: 22
  trigger:
    type: bubble
    bubble:
      dtheta_k: 8
      radius_km: 8
      center_x_m: 15000
      center_y_m: 15000
      center_z_m: 1000
    vortex_seed:
      r_max_m: 6000
      v_max_ms: 40
      z_top_m: 6000
      center_x_m: 0
      center_y_m: 0
      center_z_m: 3000
output:
  preset: presentation
  format: npy_3d
  async_io: true
  live_shm: false
extensions:
  compute:
    # Active PBL is CPU-only; do not imply an unqualified hybrid backend.
    backend: cpu
  chaos:
    scheme: none
    seed: 0
    member_id: 0
  validation:
    guard_mode: warn
