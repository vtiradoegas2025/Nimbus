schema: nimbus.v1

grid:
  coordinate_system: cartesian
  staggering: c_grid
  nx: 12
  ny: 12
  nz: 48
  dx: 1000
  dy: 1000
  dz: 250
  ztop: 12000

time:
  run_time: 4
  dt_large: 0.2
  acoustic_substeps: 6
  adaptive_dt: false
  cfl_safety: 0.7
  output_interval: 4

dynamics:
  scheme: klemp_wilhelmson_split_cartesian_cgrid
  axisymmetric: false

advection:
  scheme: tvd

boundary_conditions:
  lateral:
    west: periodic
    east: periodic
    south: periodic
    north: periodic
  bottom: rigid_slip
  top: rigid

damping:
  enabled: false
  z_d: 12000
  alpha: 0
  mode: explicit
  lateral_width: 0
  lateral_alpha: 0
  lateral_sponge_enabled: false
  w_only_top_sponge: false
  w_only_depth_cells: 0
  w_only_alpha_max: 0

coriolis:
  enabled: false
  mode: f_plane
  latitude_deg: 35

microphysics:
  scheme: kessler
  milbrandt:
    triple_moment: true
    hail_processes: true

turbulence:
  scheme: none
  mode: 3d
  Cs: 0.18
  Pr_t: 0.7
  Sc_t: 0.7

diffusion:
  scheme: explicit
  operator_order: 2
  K_h: 0
  K_v: 0
  apply_to: scalars

surface:
  scheme: slab
  apply_fluxes: true
  z0m_m: 0.1
  z0h_m: 0.01
  albedo: 0.2
  emissivity: 0.96
  tsk_k: 300

boundary_layer:
  scheme: ysu

radiation:
  scheme: rrtmg
  solar_forcing: idealized_diurnal
  latitude_deg: 35
  declination_deg: 15
  local_solar_time_at_start_h: 12
  do_lw: true
  do_sw: true
  cadence_s: 1
  clear_sky_only: true
  rrtmg_ozone_vmr: 0.000004

initial_conditions:
  sounding:
    type: file
    file_path: tests/fixtures/configs/qualification/soundings/milbrandt_mixed_profile.txt
  hodograph:
    type: wk_param
    u_sfc_ms: 5
    v_sfc_ms: 2
    u_1km_ms: 8
    v_1km_ms: 5
    u_6km_ms: 20
    v_6km_ms: 12
  trigger:
    type: none

output:
  preset: dynamics_full
  format: npy_3d
  async_io: false
  live_shm: false

extensions:
  execution:
    mode: qualified
  compute:
    backend: cpu
    allow_fallback: false
    gpu_apply_microphysics: false
    gpu_apply_slow: false
    gpu_apply_sgs: false
  checkpoint:
    every_s: 2
  diagnostics:
    scientific_every_steps: 1
    deterministic_reductions: true
  validation:
    guard_mode: error
